GameEngine.prototype.loop=function(){
  if(!this.running)return;var self=this;
  try{
  var now=performance.now();var rawDt=(now-this.lastTime)/16.67;var dt=Math.min(rawDt,3);this.lastTime=now;this.time+=dt;this.frameCount++;
  var cw=window.innerWidth|0,ch=window.innerHeight|0;
  if(this.cachedWidth!==cw||this.cachedHeight!==ch){this.cachedWidth=cw;this.cachedHeight=ch;this.canvas.width=cw;this.canvas.height=ch}
  if(!this.playerDead&&!this.bustedShown){this.updatePlayer(dt);this.updateNPCs(dt);this.updatePedestrians(dt);this.updatePlayerPolice(dt);this.updateMissions(dt)}
  else if(this.bustedShown){/* frozen — police caught player */}
  else{this.deathTime+=dt;this.shakeAmount*=0.92;if(this.activeMission)this.failMission()}
  this.updateParticles(dt);this.updateCamera(dt);this.render();
  }catch(e){console.error('Game loop error:',e)}
  this.animFrame=requestAnimationFrame(function(){self.loop()});
};

GameEngine.prototype.updatePlayer=function(dt){
  var p=this.player,keys=this.keys,tc=this.touchControls;
  var up=keys.has('ArrowUp')||keys.has('w')||keys.has('W')||tc.up;
  var down=keys.has('ArrowDown')||keys.has('s')||keys.has('S')||tc.down;
  var left=keys.has('ArrowLeft')||keys.has('a')||keys.has('A')||tc.left;
  var right=keys.has('ArrowRight')||keys.has('d')||keys.has('D')||tc.right;
  var brake=keys.has(' ')||tc.brake;
  var absSpeed=Math.abs(p.speed);
  // Acceleration / deceleration
  if(up)p.speed=Math.min(p.speed+p.accel*dt,p.maxSpeed);
  else if(down)p.speed=Math.max(p.speed-p.accel*1.5*dt,-p.maxSpeed*0.4);
  else{p.speed*=0.98;if(Math.abs(p.speed)<0.05)p.speed=0}
  // Handbrake: reduce speed more, enable drifting
  if(brake){
    p.speed*=0.92;
    p.drifting=absSpeed>1.5;
    // Spawn skid marks when drifting
    if(absSpeed>1){var cos=Math.cos(p.angle),sin=Math.sin(p.angle);if(this.skidMarks.length<MAX_SKID_MARKS){this.skidMarks.push({x:p.x-sin*CAR_H*0.35-cos*CAR_W*0.3,y:p.y+cos*CAR_H*0.35-sin*CAR_W*0.3,angle:p.angle,alpha:0.6},{x:p.x-sin*CAR_H*0.35+cos*CAR_W*0.3,y:p.y+cos*CAR_H*0.35+sin*CAR_W*0.3,angle:p.angle,alpha:0.6})}}
    // Spawn tire smoke when drifting hard
    if(absSpeed>3&&this.particles.length<MAX_PARTICLES){
      for(var ti=0;ti<2;ti++){
        var wx=p.x-sin*CAR_H*0.35+(ti===0?-cos*CAR_W*0.3:cos*CAR_W*0.3);
        var wy=p.y+cos*CAR_H*0.35+(ti===0?-sin*CAR_W*0.3:sin*CAR_W*0.3);
        this.particles.push({x:wx,y:wy,vx:(Math.random()-0.5)*0.5,vy:(Math.random()-0.5)*0.5,life:20,maxLife:20,color:'#aaa',size:3+Math.random()*3});
      }
    }
  }else{
    p.drifting=false;
  }
  // Steering: sharper at low speed, smoother at high speed
  var steerRate=0.045*dt;
  if(absSpeed>0.3){
    var speedFactor=Math.min(absSpeed/p.maxSpeed,1);
    // Low speed = sharper turns, high speed = wider turns (realistic)
    var turnSharpness=1.0-speedFactor*0.4;
    // Handbrake drifting = extra sharp turns
    if(p.drifting)turnSharpness*=1.8;
    var steerAmount=steerRate*turnSharpness*Math.sign(p.speed);
    if(left)p.angle-=steerAmount;
    if(right)p.angle+=steerAmount;
    // Lateral drift: when handbrake is on, add sideways momentum
    if(p.drifting&&absSpeed>2){
      p.lateralSpeed+=(p.angle-p.driftAngle)*0.15*dt;
    }
  }
  // Drift angle: visual car angle smoothly follows actual angle
  if(p.drifting&&absSpeed>2){
    // When drifting, the car body lags behind the facing direction
    p.driftAngle+=(p.angle-p.driftAngle)*0.12*dt;
    // Apply lateral slide
    p.lateralSpeed*=0.92;
    p.x+=Math.cos(p.driftAngle)*p.lateralSpeed*dt;
    p.y+=Math.sin(p.driftAngle)*p.lateralSpeed*dt;
  }else{
    p.driftAngle+=(p.angle-p.driftAngle)*0.2*dt;
    p.lateralSpeed*=0.8;
  }
  // Movement along facing direction
  var npx=p.x+Math.sin(p.driftAngle)*p.speed*dt,npy=p.y-Math.cos(p.driftAngle)*p.speed*dt;
  var tileX=Math.floor(npx/TILE_SIZE),tileY=Math.floor(npy/TILE_SIZE);
  if(tileX>=0&&tileX<MAP_W&&tileY>=0&&tileY<MAP_H){var tile=this.map[tileY][tileX];if(this.isDrivable(tile)){p.x=npx;p.y=npy;if(tile===6)p.speed*=0.95;if(tile===4)p.speed*=0.98}else{var is=Math.abs(p.speed);p.speed*=-0.3;if(is>1){this.spawnParticles(npx,npy,5,'#ffaa44',4,30);p.health-=is*2;this.shakeAmount=Math.min(15,this.shakeAmount+is*1.5)}}}
  p.x=Math.max(CAR_W,Math.min(MAP_W*TILE_SIZE-CAR_W,p.x));p.y=Math.max(CAR_H,Math.min(MAP_H*TILE_SIZE-CAR_H,p.y));
  // Exhaust particles
  var ec=p.health>30?0.3:0.6;
  if(absSpeed>0.5&&Math.random()<ec&&this.particles.length<MAX_PARTICLES){var ex=p.x-Math.sin(p.driftAngle)*CAR_H*0.5,ey=p.y+Math.cos(p.driftAngle)*CAR_H*0.5;var col=p.health>30?'#666':(Math.random()>0.5?'#555':'#222');this.particles.push({x:ex+(Math.random()-0.5)*4,y:ey+(Math.random()-0.5)*4,vx:(Math.random()-0.5)*1-Math.sin(p.driftAngle)*p.speed*0.2,vy:(Math.random()-0.5)*1+Math.cos(p.driftAngle)*p.speed*0.2,life:25,maxLife:25,color:col,size:2+Math.random()*2})}
  // Smoke when damaged
  if(p.health<50&&this.particles.length<MAX_PARTICLES){var sr=(50-p.health)/50;if(Math.random()<sr*0.4){var hx=p.x+Math.sin(p.driftAngle)*CAR_H*0.3+(Math.random()-0.5)*8,hy=p.y-Math.cos(p.driftAngle)*CAR_H*0.3+(Math.random()-0.5)*8;this.particles.push({x:hx,y:hy,vx:(Math.random()-0.5)*0.5,vy:-1-Math.random(),life:40,maxLife:40,color:p.health<25?'#111':'#555',size:3+Math.random()*4})}}
  // Fire when critical
  if(p.health<25&&this.particles.length<MAX_PARTICLES&&Math.random()<0.35){this.particles.push({x:p.x+(Math.random()-0.5)*CAR_W,y:p.y+(Math.random()-0.5)*CAR_H*0.5,vx:(Math.random()-0.5)*2,vy:-2-Math.random()*3,life:15,maxLife:15,color:Math.random()>0.5?'#ff6600':'#ffcc00',size:4+Math.random()*5})}
  // Slow health regen
  if(p.health<100&&p.health>30)p.health=Math.min(100,p.health+0.02*dt);
  // NPC collision
  for(var i=0;i<this.npcs.length;i++){var npc=this.npcs[i];if(npc.dead)continue;var dx=p.x-npc.x,dy=p.y-npc.y,ds=dx*dx+dy*dy;if(ds<1225){var dist=Math.sqrt(ds),pa=Math.atan2(dy,dx),pf=(35-dist)*0.3;p.x+=Math.cos(pa)*pf;p.y+=Math.sin(pa)*pf;npc.x-=Math.cos(pa)*pf*0.5;npc.y-=Math.sin(pa)*pf*0.5;var impF=absSpeed+Math.abs(npc.speed);p.speed*=0.7;npc.speed*=0.7;p.health-=2+impF*0.5;npc.health-=5+impF;this.spawnParticles((p.x+npc.x)/2,(p.y+npc.y)/2,6,'#ff6633',6,20);this.wantedLevel=Math.min(5,this.wantedLevel+0.1);this.score+=10;this.shakeAmount=Math.min(10,this.shakeAmount+impF*1.5);if(npc.health<=0&&!npc.dead){npc.dead=true;npc.deathTimer=300;this.spawnExplosion(npc.x,npc.y);this.score+=50;this.shakeAmount=15}}}
  // wantedLevel decay is now handled in updatePlayerPolice
  if(p.health<=0&&!this.playerDead){this.playerDead=true;this.deathTime=0;p.health=0;p.speed=0;this.shakeAmount=20;this.spawnExplosion(p.x,p.y);if(this.onDeath)this.onDeath()}
};

GameEngine.prototype.updateNPCs=function(dt){
  var px=this.player.x,py=this.player.y;
  // No more in-game training — using pre-trained weights

  for(var i=0;i<this.npcs.length;i++){var npc=this.npcs[i];
    if(npc.dead){
      npc.deathTimer+=dt;
      if(npc.deathTimer<240&&this.particles.length<MAX_PARTICLES&&Math.random()<0.15){this.particles.push({x:npc.x+(Math.random()-0.5)*CAR_W,y:npc.y+(Math.random()-0.5)*CAR_H*0.3,vx:(Math.random()-0.5)*1.5,vy:-1.5-Math.random()*2,life:20,maxLife:20,color:Math.random()>0.5?'#ff4400':'#444',size:2+Math.random()*3})}
      if(npc.deathTimer>80&&!npc.medicQueued){
        npc.medicQueued=true;
        this.deadNpcQueue.push({npcIndex:i,x:npc.x,y:npc.y,angle:npc.driftAngle,type:'medic',timer:0});
      }
      var hasEV=false;
      for(var evi=0;evi<this.emergencyVehicles.length;evi++){
        if(this.emergencyVehicles[evi].npcIndex===i){hasEV=true;break}
      }
      // On death: respawn
      if(!npc.beingTowed&&!hasEV&&npc.deathTimer>600){
        // Save champion
        if(this.botFitness[i]>this.bestFitness){
          this.bestFitness=this.botFitness[i];
        }
        this.botFitness[i]=0;
        // Remove emergency vehicles
        for(var evi2=this.emergencyVehicles.length-1;evi2>=0;evi2--){
          if(this.emergencyVehicles[evi2].npcIndex===i)this.emergencyVehicles.splice(evi2,1);
        }
        // Respawn
        this.npcs[i]=this.spawnBotAnywhere(i);
        this.botBrains[i].lastX=this.npcs[i].x;
        this.botBrains[i].lastY=this.npcs[i].y;
      }
      continue;
    }
    if(!npc.npc)continue;

    // Off map → respawn
    if(npc.x<0||npc.x>MAP_W*TILE_SIZE||npc.y<0||npc.y>MAP_H*TILE_SIZE){
      this.botFitness[i]-=20;
      this.npcs[i]=this.spawnBotAnywhere(i);
      this.botBrains[i].lastX=this.npcs[i].x;
      this.botBrains[i].lastY=this.npcs[i].y;
      continue;
    }

    // Stuck detection
    var ctx=npc.x/TILE_SIZE|0,cty=npc.y/TILE_SIZE|0;
    var ct=(ctx>=0&&ctx<MAP_W&&cty>=0&&cty<MAP_H)?this.map[cty][ctx]:0;
    if(!(ct>=1&&ct<=4)&&ct!==6){npc.npc.stuckTimer+=dt;this.botFitness[i]-=0.5}
    else{npc.npc.stuckTimer=0}
    if(npc.npc.stuckTimer>180||npc.health<=0){
      this.botFitness[i]-=20;
      this.npcs[i]=this.spawnBotAnywhere(i);
      this.botBrains[i].lastX=this.npcs[i].x;
      this.botBrains[i].lastY=this.npcs[i].y;
      continue;
    }

    // ========= FITNESS REWARD =========
    var brain=this.botBrains[i];
    brain.age++;
    var reward=0; // Per-frame reward for REINFORCE
    
    if(ct>=1&&ct<=3||ct===6){reward+=1.5;brain.roadTime++;}
    else if(ct===4){reward-=0.5;}
    
    var distMoved=0;
    if(brain.age>1){
      var ddx=npc.x-brain.lastX,ddy=npc.y-brain.lastY;
      distMoved=Math.sqrt(ddx*ddx+ddy*ddy);
      if(ct>=1&&ct<=3||ct===6)reward+=distMoved*0.3;
      else reward+=distMoved*0.05;
    }
    brain.lastX=npc.x;brain.lastY=npc.y;
    
    var absSpeed=Math.abs(npc.speed);
    if(absSpeed>1&&absSpeed<npc.maxSpeed*0.9)reward+=0.8;
    else if(absSpeed>npc.maxSpeed*0.9)reward+=0.3;
    brain.avgSpeed=(brain.avgSpeed*0.99)+absSpeed*0.01;
    
    // Smooth driving reward
    if(brain.age>2){
      var angleChange=Math.abs(npc.angle-(npc.npc.lastAngle||npc.angle));
      if(angleChange<0.05)reward+=0.3;
      else if(angleChange>0.2)reward-=0.2;
    }
    npc.npc.lastAngle=npc.angle;
    
    // Center of road reward
    if(ct>=1&&ct<=3||ct===6){
      var tileCX=ctx*TILE_SIZE+TILE_SIZE/2;
      var tileCY=cty*TILE_SIZE+TILE_SIZE/2;
      var centerDist=Math.sqrt((npc.x-tileCX)*(npc.x-tileCX)+(npc.y-tileCY)*(npc.y-tileCY));
      if(centerDist<12)reward+=0.5;
      else if(centerDist>20)reward-=0.3;
    }
    
    this.botFitness[i]+=reward;

    // ========= AI PATHFINDING — GPS for the NN =========
    npc.npc.pathTimer+=dt;
    if(!npc.npc.path||npc.npc.pathIndex>=npc.npc.path.length||npc.npc.pathTimer>300){
      this.assignAIPath(npc);
    }
    if(npc.npc.path&&npc.npc.pathIndex<npc.npc.path.length){
      var wp=npc.npc.path[npc.npc.pathIndex];
      var wpx=wp.x*TILE_SIZE+TILE_SIZE/2,wpy=wp.y*TILE_SIZE+TILE_SIZE/2;
      var dwx=wpx-npc.x,dwy=wpy-npc.y;
      var dwDist=dwx*dwx+dwy*dwy;
      if(dwDist<600||(ctx===wp.x&&cty===wp.y)&&dwDist<1800){
        npc.npc.pathIndex++;
        this.botFitness[i]+=3;
        reward+=3;
        if(npc.npc.pathIndex>=npc.npc.path.length){this.assignAIPath(npc)}
      }
    }

    // ========= PRE-TRAINED NEURAL NETWORK =========
    // Forward pass only — weights were trained with real backpropagation
    var sensors=computeSensors(npc,this);
    var inputs=sensorsToInputs(sensors);
    
    // Forward pass through pre-trained network
    var nnOutputs=brain.forward(inputs);
    
    // Safety: blend with teacher when NN confidence is low
    var teacherActions=computeTeacherActions(npc,sensors,this);
    var onRoad=sensors.onRoad;
    var frontClear=sensors.road[0];
    
    // Adaptive blend: use NN more when on road and clear ahead
    var nnWeight=onRoad>0.5&&frontClear>0.5?0.9:0.6;
    if(frontClear<0.3)nnWeight=0.2; // Emergency: trust teacher more
    
    var finalOutputs=[];
    for(var oi=0;oi<nnOutputs.length;oi++){
      finalOutputs.push(Math.max(-1,Math.min(1,nnOutputs[oi]*nnWeight+teacherActions[oi]*(1-nnWeight))));
    }

    // ========= APPLY NN OUTPUTS =========
    var nnSteer=finalOutputs[0];
    var nnGas=finalOutputs[1];
    var nnSpeedDesire=(finalOutputs[2]+1)/2; // 0 to 1
    var nnLaneFix=finalOutputs[3];

    // Steering
    var steerStrength=0.09;
    if(absSpeed>npc.maxSpeed*0.7)steerStrength=0.06;
    npc.angle+=nnSteer*steerStrength*dt;

    // Lane correction (learned by NN, not hardcoded)
    if(ct>=1&&ct<=3||ct===6){
      npc.x+=nnLaneFix*0.4*dt;
      npc.y+=nnLaneFix*0.15*dt;
    }

    // Speed control
    if(nnGas>0.05){
      var targetSpeed=npc.maxSpeed*nnSpeedDesire;
      if(npc.speed<targetSpeed){
        npc.speed=Math.min(npc.speed+npc.accel*Math.min(1,nnGas)*dt,npc.maxSpeed);
      }else{
        npc.speed+=(targetSpeed-npc.speed)*0.05*dt;
      }
    }else if(nnGas<-0.05){
      npc.speed*=0.90;
    }else{
      npc.speed*=0.995;
      if(Math.abs(npc.speed)<0.1)npc.speed=0;
    }

    // ========= NPC-NPC COLLISION =========
    for(var j=0;j<this.npcs.length;j++){
      if(j===i||this.npcs[j].dead)continue;
      var ax=npc.x-this.npcs[j].x,ay=npc.y-this.npcs[j].y;
      var ad2=ax*ax+ay*ay;
      if(ad2<900){
        var apd=Math.sqrt(ad2)||1;
        var nx1=ax/apd,ny1=ay/apd;
        var relSpeed=Math.abs(npc.speed)+Math.abs(this.npcs[j].speed);
        if(ad2<700&&relSpeed>3.5){
          var vi_n=npc.speed*(Math.sin(npc.angle)*nx1-Math.cos(npc.angle)*ny1);
          var vj_n=this.npcs[j].speed*(-Math.sin(this.npcs[j].angle)*nx1+Math.cos(this.npcs[j].angle)*ny1);
          var approaching=vi_n+vj_n;
          if(approaching>1.5){
            var dmg=3+relSpeed*2;
            npc.health-=dmg;this.npcs[j].health-=dmg;
            npc.x+=nx1*2;npc.y+=ny1*2;
            this.npcs[j].x-=nx1*2;this.npcs[j].y-=ny1*2;
            npc.speed*=0.3;this.npcs[j].speed*=0.3;
            this.spawnParticles((npc.x+this.npcs[j].x)/2,(npc.y+this.npcs[j].y)/2,5,'#ff6633',5,15);
            this.botFitness[i]-=15;
            if(npc.health<=0&&!npc.dead){npc.dead=true;npc.deathTimer=0;this.spawnExplosion(npc.x,npc.y)}
            if(this.npcs[j].health<=0&&!this.npcs[j].dead){this.npcs[j].dead=true;this.npcs[j].deathTimer=0;this.spawnExplosion(this.npcs[j].x,this.npcs[j].y)}
          }
        }
        npc.x+=nx1*0.3*dt;npc.y+=ny1*0.3*dt;
      }
    }

    // ========= MOVEMENT =========
    var nnx=npc.x+Math.sin(npc.angle)*npc.speed*dt;
    var nny=npc.y-Math.cos(npc.angle)*npc.speed*dt;
    var ntx=nnx/TILE_SIZE|0,nty=nny/TILE_SIZE|0;
    if(ntx>=0&&ntx<MAP_W&&nty>=0&&nty<MAP_H&&this.isDrivable(this.map[nty][ntx])){
      npc.x=nnx;npc.y=nny;
    }else{
      npc.speed*=0.15;
      this.botFitness[i]-=5;
      var tileCX2=ctx*TILE_SIZE+TILE_SIZE/2;
      var tileCY2=cty*TILE_SIZE+TILE_SIZE/2;
      var toCenterAngle=Math.atan2(tileCX2-npc.x,-(tileCY2-npc.y));
      var centerDiff=toCenterAngle-npc.angle;
      if(centerDiff>Math.PI)centerDiff-=Math.PI*2;else if(centerDiff<-Math.PI)centerDiff+=Math.PI*2;
      npc.angle+=centerDiff*0.2;
      npc.x+=(tileCX2-npc.x)*0.03;
      npc.y+=(tileCY2-npc.y)*0.03;
      npc.npc.stuckTimer+=3;
      this.assignAIPath(npc);
    }
    npc.x=Math.max(CAR_W,Math.min(MAP_W*TILE_SIZE-CAR_W,npc.x));
    npc.y=Math.max(CAR_H,Math.min(MAP_H*TILE_SIZE-CAR_H,npc.y));
    npc.driftAngle=npc.angle;
  }

  // ========= UPDATE STATS =========
  // Periodic stats update (every ~10 seconds)
  if(this.frameCount%600===0&&this.botFitness.length>0){
    var totalF=0,maxF=-Infinity;
    for(var i=0;i<this.botFitness.length;i++){totalF+=this.botFitness[i];if(this.botFitness[i]>maxF)maxF=this.botFitness[i]}
    this.avgFitness=totalF/this.botFitness.length;
    this.bestFitness=Math.max(this.bestFitness,maxF);
    this.generation++;
  }

  this.updateEmergency(dt);
};

// ========= AUTONOMOUS SPAWN: anywhere on the road network =========
GameEngine.prototype.spawnBotAnywhere=function(index){
  // Pick a random road tile anywhere on the map
  var tile=this.roadTiles[Math.floor(Math.random()*this.roadTiles.length)];
  var angle=0;
  var roadType=this.map[tile.y][tile.x];
  if(roadType===1)angle=Math.random()>0.5?0:Math.PI;
  else if(roadType===2)angle=Math.random()>0.5?Math.PI/2:-Math.PI/2;
  else if(roadType===3){var dirs=[0,Math.PI/2,Math.PI,-Math.PI/2];angle=dirs[Math.floor(Math.random()*4)];}
  else angle=Math.random()*Math.PI*2;
  
  var rn={x:tile.x*TILE_SIZE+TILE_SIZE/2,y:tile.y*TILE_SIZE+TILE_SIZE/2,angle:angle,speed:1+Math.random()*1.5,maxSpeed:3+Math.random()*3,accel:0.07,color:this.npcColors[index%4],isPlayer:false,driftAngle:angle,health:100,dead:false,deathTimer:0,medicQueued:false,towQueued:false,medicDone:false,beingTowed:false,towDone:false,policeChase:false,
    npc:{targetX:tile.x*TILE_SIZE+TILE_SIZE/2,targetY:tile.y*TILE_SIZE+TILE_SIZE/2,waitTimer:0,stuckTimer:0,
      path:null,pathIndex:0,pathTimer:0,
      prevTileX:-1,prevTileY:-1,
      lastDir:angle,avoidTimer:0,
      nextTurnAngle:0,distanceToTurn:999,
      personality:Math.random(),
      signalTimer:0,
      lastAngle:angle
    }
  };
  this.assignAIPath(rn);
  return rn;
};

// ============================================================
// EMERGENCY VEHICLE SYSTEM (Ambulance + Tow Truck)
// Ambulance arrives first, picks up injured person.
// THEN tow truck is dispatched, hooks up wreck, drags it away.
// Wreck only disappears when tow truck exits the map.
// ============================================================
GameEngine.prototype.updateEmergency=function(dt){
  // Decay notification timer
  if(this.emergencyNotifyTimer>0)this.emergencyNotifyTimer-=dt;
  // Process dead NPC queue — spawn emergency vehicles
  this.emergencySpawnTimer-=dt;
  if(this.emergencySpawnTimer<=0&&this.deadNpcQueue.length>0&&this.emergencyVehicles.length<4){
    var job=this.deadNpcQueue.shift();
    // Find a road tile away from the crash site to spawn from
    var crashTX=job.x/TILE_SIZE|0,crashTY=job.y/TILE_SIZE|0;
    var bestTile=null,bestDist=0;
    for(var i=0;i<this.roadTiles.length;i++){
      var t=this.roadTiles[i];
      var dx=t.x-crashTX,dy=t.y-crashTY,d=dx*dx+dy*dy;
      if(d>25&&d<400&&this.map[t.y][t.x]>=1&&this.map[t.y][t.x]<=3){
        if(d>bestDist){bestDist=d;bestTile=t}
      }
    }
    if(!bestTile)bestTile=this.roadTiles[Math.floor(Math.random()*this.roadTiles.length)];
    var spawnAngle=0;
    // Face toward crash site
    var sdx=job.x-(bestTile.x*TILE_SIZE+TILE_SIZE/2),sdy=job.y-(bestTile.y*TILE_SIZE+TILE_SIZE/2);
    spawnAngle=Math.atan2(sdx,-sdy);
    // Set exit point (far from crash)
    var exTile=this.roadTiles[Math.floor(Math.random()*this.roadTiles.length)];

    // For medic: spawn at bestTile, for tow: spawn slightly offset
    var spawnOffset=(job.type==='tow')?TILE_SIZE*1.5:0;
    var offsetX=Math.sin(spawnAngle+Math.PI)*spawnOffset;
    var offsetY=-Math.cos(spawnAngle+Math.PI)*spawnOffset;

    this.emergencyVehicles.push({
      type:job.type, // 'medic' or 'tow' or 'ped_medic'
      x:bestTile.x*TILE_SIZE+TILE_SIZE/2+offsetX,
      y:bestTile.y*TILE_SIZE+TILE_SIZE/2+offsetY,
      angle:spawnAngle,
      driftAngle:spawnAngle,
      speed:0,
      maxSpeed:job.type==='medic'||job.type==='ped_medic'?4:3,
      accel:0.08,
      state:'driving', // driving → waiting → arriving → loading → leaving → done
      targetX:job.x,
      targetY:job.y,
      npcIndex:job.npcIndex,
      pedIndex:job.pedIndex||(-1), // pedestrian index if ped_medic
      loadTimer:0,
      flashTimer:0,
      sirenPhase:0,
      exitX:exTile.x*TILE_SIZE+TILE_SIZE/2,
      exitY:exTile.y*TILE_SIZE+TILE_SIZE/2
    });
    this.emergencySpawnTimer=60;
    // Show dispatch notification
    if(job.type==='medic')this.emergencyNotify='ВЫЗВАНА СКОРАЯ ПОМОЩЬ';
    else if(job.type==='ped_medic')this.emergencyNotify='ВЫЗВАНА СКОРАЯ ПОМОЩЬ (ПЕШЕХОД)';
    else this.emergencyNotify='ВЫЗВАН ЭВАКУАТОР';
    this.emergencyNotifyTimer=90;
  }
  // Update each emergency vehicle
  var wi=0;
  for(var i=0;i<this.emergencyVehicles.length;i++){
    var ev=this.emergencyVehicles[i];
    ev.flashTimer+=dt;
    ev.sirenPhase+=dt*0.3;
    var npc=this.npcs[ev.npcIndex];

    if(ev.state==='driving'){
      // Update target based on type
      if(ev.type==='police'){
        // Police chases NPC — update target to NPC position
        var targetNpc=this.npcs[ev.npcIndex];
        if(targetNpc&&!targetNpc.dead){ev.targetX=targetNpc.x;ev.targetY=targetNpc.y}
        else{ev.state='leaving';ev.targetX=ev.exitX;ev.targetY=ev.exitY;ev.speed=1;}
      }else if(npc&&npc.dead){
        ev.targetX=npc.x;ev.targetY=npc.y;
      }else if(ev.type==='ped_medic'&&ev.pedIndex>=0){
        // Update target to injured pedestrian position
        var ped=this.pedestrians[ev.pedIndex];
        if(ped&&ped.injured){ev.targetX=ped.x;ev.targetY=ped.y}
        else{ev.state='leaving';ev.targetX=ev.exitX;ev.targetY=ev.exitY;ev.speed=1;}
      }
      // Drive toward crash site
      var dx=ev.targetX-ev.x,dy=ev.targetY-ev.y;
      var dist=Math.sqrt(dx*dx+dy*dy);
      var arriveDist=ev.type==='police'?40:60;
      if(dist<arriveDist){
        // Arrived at target
        if(ev.type==='tow'){
          if(npc&&npc.dead&&!npc.medicDone){ev.state='waiting';ev.speed=0}
          else{ev.state='arriving';ev.speed=0;ev.loadTimer=90}
        }else if(ev.type==='police'){
          ev.state='chasing';ev.speed=0;ev.chaseTimer=0;
        }else{
          ev.state='arriving';ev.speed=0;ev.loadTimer=90;
        }
      }else{
        // Steer toward target — with road-following for emergency vehicles
        var ta=Math.atan2(dx,-dy),ad=ta-ev.angle;
        if(ad>Math.PI)ad-=Math.PI*2;else if(ad<-Math.PI)ad+=Math.PI*2;
        // Faster steering for emergency vehicles
        ev.angle+=(ad>0?1:-1)*Math.min(Math.abs(ad),0.05*dt);
        ev.speed=Math.min(ev.speed+ev.accel*dt,ev.maxSpeed);
      }
    }else if(ev.state==='waiting'){
      // Tow truck waiting for medic to finish
      ev.speed=0;
      if(!npc||!npc.dead||npc.medicDone){
        // Medic finished — now proceed
        ev.state='arriving';
        ev.loadTimer=90;
      }
      // Flashing lights while waiting
      if(this.particles.length<MAX_PARTICLES&&Math.random()<0.15){
        this.particles.push({x:ev.x+(Math.random()-0.5)*CAR_W,y:ev.y+(Math.random()-0.5)*CAR_H*0.3,vx:(Math.random()-0.5)*0.5,vy:-0.5-Math.random()*0.5,life:10,maxLife:10,color:'#ffcc00',size:2+Math.random()*2});
      }
    }else if(ev.state==='chasing'){
      // Police chasing NPC — follow and flash lights
      ev.chaseTimer+=dt;
      var targetNpc2=this.npcs[ev.npcIndex];
      if(targetNpc2&&!targetNpc2.dead){
        ev.targetX=targetNpc2.x;ev.targetY=targetNpc2.y;
        var cdx=ev.targetX-ev.x,cdy=ev.targetY-ev.y;
        var cdist=Math.sqrt(cdx*cdx+cdy*cdy);
        if(cdist>5){
          var cta=Math.atan2(cdx,-cdy),cad=cta-ev.angle;
          if(cad>Math.PI)cad-=Math.PI*2;else if(cad<-Math.PI)cad+=Math.PI*2;
          ev.angle+=(cad>0?1:-1)*Math.min(Math.abs(cad),0.06*dt);
          ev.speed=Math.min(ev.speed+ev.accel*dt,ev.maxSpeed);
        }else{ev.speed*=0.9}
      }
      // Stop chasing after duration or NPC is dead/gone
      if(ev.chaseTimer>ev.chaseDuration||!targetNpc2||targetNpc2.dead){
        ev.state='leaving';ev.targetX=ev.exitX;ev.targetY=ev.exitY;ev.speed=1;
        // Reset NPC police chase flag
        if(targetNpc2){targetNpc2.policeChase=false;targetNpc2.color=this.npcColors[ev.npcIndex%4]}
      }
      // Police siren particles
      if(this.particles.length<MAX_PARTICLES&&Math.random()<0.2){
        var pColor=Math.sin(ev.flashTimer*0.5)>0?'#ff0000':'#0044ff';
        this.particles.push({x:ev.x+(Math.random()-0.5)*CAR_W,y:ev.y+(Math.random()-0.5)*CAR_H*0.3,vx:(Math.random()-0.5)*0.5,vy:-0.5-Math.random()*0.5,life:10,maxLife:10,color:pColor,size:2+Math.random()*2});
      }
    }else if(ev.state==='arriving'){
      ev.loadTimer-=dt;
      // Flashing lights particles
      if(this.particles.length<MAX_PARTICLES&&Math.random()<0.3){
        var lColor=Math.sin(ev.flashTimer*0.5)>0?'#ff0000':'#0044ff';
        if(ev.type==='tow')lColor='#ffcc00';
        this.particles.push({x:ev.x+(Math.random()-0.5)*CAR_W,y:ev.y+(Math.random()-0.5)*CAR_H*0.3,vx:(Math.random()-0.5)*0.5,vy:-0.5-Math.random()*0.5,life:10,maxLife:10,color:lColor,size:2+Math.random()*2});
      }
      if(ev.loadTimer<=0){
        ev.state='loading';
        if(ev.type==='medic'){
          this.spawnParticles(ev.targetX,ev.targetY,10,'#ffffff',3,20);
          this.spawnParticles(ev.targetX,ev.targetY,8,'#ff0000',2,15);
        }else{
          this.spawnParticles(ev.targetX,ev.targetY,10,'#ffcc00',3,20);
        }
        ev.loadTimer=60; // Time to load
      }
    }else if(ev.state==='loading'){
      ev.loadTimer-=dt;
      // Move NPC/wreck toward emergency vehicle (being loaded)
      if(ev.type==='ped_medic'&&ev.pedIndex>=0){
        var ped2=this.pedestrians[ev.pedIndex];
        if(ped2&&ped2.injured){
          var pldx=ev.x-ped2.x,pldy=ev.y-ped2.y;
          ped2.x+=pldx*0.03*dt;ped2.y+=pldy*0.03*dt;
        }
      }else if(npc&&npc.dead){
        var ldx=ev.x-npc.x,ldy=ev.y-npc.y;
        npc.x+=ldx*0.05*dt;npc.y+=ldy*0.05*dt;
      }
      if(ev.loadTimer<=0){
        if(ev.type==='medic'){
          // Medic picks up injured person — car stays wrecked
          if(npc&&npc.dead&&!npc.medicDone){
            npc.medicDone=true;
            this.spawnParticles(npc.x,npc.y,12,'#44ff44',4,25);
            this.spawnParticles(npc.x,npc.y,8,'#ffffff',3,20);
            this.emergencyNotify='МЕДИК: ПОСТРАДАВШИЙ СПАСЁН';
            this.emergencyNotifyTimer=120;
            // NOW dispatch the tow truck — only after medic is done
            if(!npc.towQueued){
              npc.towQueued=true;
              this.deadNpcQueue.push({npcIndex:ev.npcIndex,x:npc.x,y:npc.y,angle:npc.driftAngle,type:'tow',timer:0});
            }
          }
        }else if(ev.type==='ped_medic'){
          // Medic heals injured pedestrian
          if(ev.pedIndex>=0){
            var ped3=this.pedestrians[ev.pedIndex];
            if(ped3&&ped3.injured){
              ped3.injured=false;ped3.ambulanceDone=true;
              ped3.health=100;
              this.spawnParticles(ped3.x,ped3.y,12,'#44ff44',4,25);
              this.spawnParticles(ped3.x,ped3.y,8,'#ffffff',3,20);
              this.emergencyNotify='МЕДИК: ПЕШЕХОД СПАСЁН';
              this.emergencyNotifyTimer=120;
            }
          }
        }else if(ev.type==='tow'){
          // Tow truck hooks up wrecked car — don't remove it yet, it will be dragged away
          if(npc&&npc.dead){
            npc.beingTowed=true;
            this.spawnParticles(npc.x,npc.y,10,'#ffaa00',4,20);
            this.spawnParticles(npc.x,npc.y,6,'#888888',3,15);
            this.emergencyNotify='ЭВАКУАТОР: БУКСИРОВКА ОБЛОМКОВ';
            this.emergencyNotifyTimer=120;
          }
        }
        ev.state='leaving';
        ev.targetX=ev.exitX;ev.targetY=ev.exitY;
        ev.speed=1;
      }
    }else if(ev.state==='leaving'){
      // Drive away to exit point
      var dx=ev.targetX-ev.x,dy=ev.targetY-ev.y;
      var dist=Math.sqrt(dx*dx+dy*dy);
      if(dist<80||dist>6000){
        ev.state='done'; // Remove when reached exit or too far
      }else{
        var ta=Math.atan2(dx,-dy),ad=ta-ev.angle;
        if(ad>Math.PI)ad-=Math.PI*2;else if(ad<-Math.PI)ad+=Math.PI*2;
        ev.angle+=(ad>0?1:-1)*Math.min(Math.abs(ad),0.03*dt);
        ev.speed=Math.min(ev.speed+ev.accel*dt,ev.maxSpeed);
      }
    }
    // Move vehicle if driving, leaving, or chasing
    if(ev.state==='driving'||ev.state==='leaving'||ev.state==='chasing'){
      var nx=ev.x+Math.sin(ev.angle)*ev.speed*dt;
      var ny=ev.y-Math.cos(ev.angle)*ev.speed*dt;
      var ntx=nx/TILE_SIZE|0,nty=ny/TILE_SIZE|0;
      if(ntx>=0&&ntx<MAP_W&&nty>=0&&nty<MAP_H&&this.isDrivable(this.map[nty][ntx])){ev.x=nx;ev.y=ny}
      else{ev.speed*=-0.2;ev.angle+=Math.PI*0.25}
      ev.driftAngle=ev.angle;
      // Tow truck drags wrecked car behind it when leaving
      if(ev.type==='tow'&&ev.state==='leaving'){
        var tnpc2=this.npcs[ev.npcIndex];
        if(tnpc2&&tnpc2.dead){
          var towDist=CAR_H*1.5;
          tnpc2.x=ev.x-Math.sin(ev.angle)*towDist;
          tnpc2.y=ev.y+Math.cos(ev.angle)*towDist;
          tnpc2.driftAngle=ev.angle;
        }
      }
    }
    // When tow truck finishes leaving, remove the wrecked car
    if(ev.state==='done'&&ev.type==='tow'){
      var dnpc=this.npcs[ev.npcIndex];
      if(dnpc&&dnpc.dead){
        this.npcs[ev.npcIndex]=this.spawnBotAnywhere(ev.npcIndex);
        this.botFitness[ev.npcIndex]=0;
        this.botBrains[ev.npcIndex].lastX=this.npcs[ev.npcIndex].x;
        this.botBrains[ev.npcIndex].lastY=this.npcs[ev.npcIndex].y;
      }
    }
    if(ev.state!=='done'){this.emergencyVehicles[wi++]=ev}
  }
  this.emergencyVehicles.length=wi;
};

// ============================================================
// PEDESTRIAN SYSTEM — walk on sidewalks, can be hit by NPC cars
// Bot hits pedestrian → police chases bot + ambulance heals pedestrian
// Player hits pedestrian → nothing for now
// ============================================================

GameEngine.prototype.spawnPedestrian=function(){
  if(this.sidewalkTiles.length===0)return{x:0,y:0,angle:0,speed:0.6,dead:false,injured:false,health:100,injuryTimer:0,ambulanceQueued:false,ambulanceDone:false,shirtColor:['#cc3333','#3366cc','#33aa55','#cc9922','#8833aa','#cc6622','#33aaaa'][Math.floor(Math.random()*7)],pantsColor:['#224466','#443322','#333333','#2a2a4a'][Math.floor(Math.random()*4)],skinTone:['#ffcc99','#e8b88a','#c69070','#a07050'][Math.floor(Math.random()*4)],walkDir:0,walkTimer:60+Math.random()*120,walkPhase:Math.random()*6.28};
  var tile=this.sidewalkTiles[Math.floor(Math.random()*this.sidewalkTiles.length)];
  var cx=tile.x*TILE_SIZE+TILE_SIZE/2,cy=tile.y*TILE_SIZE+TILE_SIZE/2;
  // Random walk direction
  var dirs=[0,Math.PI/2,Math.PI,-Math.PI/2];
  var dir=dirs[Math.floor(Math.random()*4)];
  return{x:cx,y:cy,angle:dir,speed:0.4+Math.random()*0.3,dead:false,injured:false,health:100,injuryTimer:0,ambulanceQueued:false,ambulanceDone:false,shirtColor:['#cc3333','#3366cc','#33aa55','#cc9922','#8833aa','#cc6622','#33aaaa'][Math.floor(Math.random()*7)],pantsColor:['#224466','#443322','#333333','#2a2a4a'][Math.floor(Math.random()*4)],skinTone:['#ffcc99','#e8b88a','#c69070','#a07050'][Math.floor(Math.random()*4)],walkDir:dir,walkTimer:60+Math.random()*120,walkPhase:Math.random()*6.28};
};

GameEngine.prototype.spawnPedestrianNearPlayer=function(){
  var ptx=this.player.x/TILE_SIZE|0,pty=this.player.y/TILE_SIZE|0;
  var cands=[];
  for(var i=0;i<this.sidewalkTiles.length;i++){
    var t=this.sidewalkTiles[i];
    var d=Math.abs(t.x-ptx)+Math.abs(t.y-pty);
    if(d>=8&&d<=25)cands.push(t);
  }
  if(cands.length===0)return this.spawnPedestrian();
  var tile=cands[Math.floor(Math.random()*cands.length)];
  var cx=tile.x*TILE_SIZE+TILE_SIZE/2,cy=tile.y*TILE_SIZE+TILE_SIZE/2;
  var dirs=[0,Math.PI/2,Math.PI,-Math.PI/2];
  var dir=dirs[Math.floor(Math.random()*4)];
  return{x:cx,y:cy,angle:dir,speed:0.4+Math.random()*0.3,dead:false,injured:false,health:100,injuryTimer:0,ambulanceQueued:false,ambulanceDone:false,shirtColor:['#cc3333','#3366cc','#33aa55','#cc9922','#8833aa','#cc6622','#33aaaa'][Math.floor(Math.random()*7)],pantsColor:['#224466','#443322','#333333','#2a2a4a'][Math.floor(Math.random()*4)],skinTone:['#ffcc99','#e8b88a','#c69070','#a07050'][Math.floor(Math.random()*4)],walkDir:dir,walkTimer:60+Math.random()*120,walkPhase:Math.random()*6.28};
};

GameEngine.prototype.updatePedestrians=function(dt){
  var px=this.player.x,py=this.player.y;
  for(var i=0;i<this.pedestrians.length;i++){
    var ped=this.pedestrians[i];

    // ========= INJURED PEDESTRIAN = waiting for ambulance
    if(ped.injured){
      ped.injuryTimer+=dt;
      // Queue ambulance if not already
      if(ped.injuryTimer>40&&!ped.ambulanceQueued){
        ped.ambulanceQueued=true;
        this.deadNpcQueue.push({npcIndex:-1,x:ped.x,y:ped.y,angle:0,type:'ped_medic',pedIndex:i,timer:0});
      }
      // Respawn after long timeout if no ambulance came
      if(ped.injuryTimer>1000&&!ped.ambulanceDone){
        var hasPedEV=false;
        for(var evi=0;evi<this.emergencyVehicles.length;evi++){
          if(this.emergencyVehicles[evi].pedIndex===i){hasPedEV=true;break}
        }
        if(!hasPedEV){this.pedestrians[i]=this.spawnPedestrianNearPlayer()}
      }
      continue;
    }

    // ========= RESPAWN if too far
    var dpx=ped.x-px,dpy=ped.y-py;
    if(dpx*dpx+dpy*dpy>PED_RESPAWN_DIST*PED_RESPAWN_DIST){this.pedestrians[i]=this.spawnPedestrianNearPlayer();continue}

    // ========= WALKING AI
    ped.walkTimer-=dt;
    if(ped.walkTimer<=0){
      // Pick new direction — prefer staying on sidewalk
      var dirs=[0,Math.PI/2,Math.PI,-Math.PI/2];
      var bestDir=ped.angle,bestScore=-1;
      for(var d=0;d<4;d++){
        var testAngle=dirs[d];
        var testX=ped.x+Math.sin(testAngle)*TILE_SIZE;
        var testY=ped.y-Math.cos(testAngle)*TILE_SIZE;
        var ttx=testX/TILE_SIZE|0,tty=testY/TILE_SIZE|0;
        if(ttx>=0&&ttx<MAP_W&&tty>=0&&tty<MAP_H){
          var tt=this.map[tty][ttx];
          if(tt===4){var sc=3+Math.random()*2;if(sc>bestScore){bestScore=sc;bestDir=testAngle}}
          else if(tt===6||tt===3){var sc=1+Math.random();if(sc>bestScore){bestScore=sc;bestDir=testAngle}}
        }
      }
      ped.angle=bestDir;
      ped.walkTimer=60+Math.random()*120;
    }

    // ========= MOVEMENT
    ped.walkPhase+=dt*0.15;
    var spd=ped.speed*dt;
    var nx=ped.x+Math.sin(ped.angle)*spd;
    var ny=ped.y-Math.cos(ped.angle)*spd;
    var ntx=nx/TILE_SIZE|0,nty=ny/TILE_SIZE|0;
    // Pedestrians walk on sidewalks, parks, and cross roads
    if(ntx>=0&&ntx<MAP_W&&nty>=0&&nty<MAP_H){
      var tt=this.map[nty][ntx];
      if(tt===4||tt===6||tt===3){ped.x=nx;ped.y=ny}
      else{ped.angle+=Math.PI;ped.walkTimer=20+Math.random()*40;} // Turn around
    }else{ped.angle+=Math.PI;ped.walkTimer=20+Math.random()*40;}
    ped.x=Math.max(4,Math.min(MAP_W*TILE_SIZE-4,ped.x));
    ped.y=Math.max(4,Math.min(MAP_H*TILE_SIZE-4,ped.y));

    // ========= CHECK COLLISION WITH NPC CARS
    for(var j=0;j<this.npcs.length;j++){
      var npc=this.npcs[j];
      if(npc.dead)continue;
      var cdx=ped.x-npc.x,cdy=ped.y-npc.y;
      var cd2=cdx*cdx+cdy*cdy;
      if(cd2<625){ // within 25px — car hit pedestrian
        var impSpeed=Math.abs(npc.speed);
        if(impSpeed>1.5){
          // NPC hit pedestrian!
          ped.injured=true;
          ped.injuryTimer=0;
          ped.health=Math.max(0,ped.health-impSpeed*8);
          if(ped.health<=0)ped.dead=true;
          this.spawnParticles(ped.x,ped.y,8,'#ff4444',4,20);
          this.spawnParticles(ped.x,ped.y,5,'#ffcc99',3,15);
          var pushDist=Math.sqrt(cd2)||1;
          ped.x+=cdx/pushDist*15;
          ped.y+=cdy/pushDist*15;
          npc.speed*=0.3;
          // Police chase this NPC!
          if(!npc.policeChase){
            npc.policeChase=true;
            npc.color='#111111';
            npc.maxSpeed=Math.min(npc.maxSpeed+2,8);
            this.spawnPoliceChase(npc);
          }
          break;
        }
      }
    }

    // ========= CHECK COLLISION WITH PLAYER CAR
    if(!ped.injured&&!ped.dead){
      var ppdx=ped.x-px,ppdy=ped.y-py;
      var ppd2=ppdx*ppdx+ppdy*ppdy;
      if(ppd2<625){ // within 25px — player hit pedestrian
        var pImpSpeed=Math.abs(this.player.speed);
        if(pImpSpeed>1.5){
          // Player hit pedestrian — WANTED LEVEL + ambulance + police chase!
          ped.injured=true;
          ped.injuryTimer=0;
          ped.health=Math.max(0,ped.health-pImpSpeed*6);
          if(ped.health<=0)ped.dead=true;
          this.spawnParticles(ped.x,ped.y,12,'#ff4444',5,25);
          this.spawnParticles(ped.x,ped.y,8,'#ffcc99',3,18);
          var ppDist=Math.sqrt(ppd2)||1;
          ped.x+=ppdx/ppDist*15;
          ped.y+=ppdy/ppDist*15;
          this.player.speed*=0.7;
          this.shakeAmount=8;
          this.checkpointFlash=15;
          // === WANTED LEVEL: hit pedestrian = +1 star, kill = +2 ===
          var starsAdd=ped.health<=0?2:1;
          var prevWanted=this.wantedLevel|0;
          this.wantedLevel=Math.min(5,this.wantedLevel+starsAdd);
          var newWanted=this.wantedLevel|0;
          if(newWanted>prevWanted){
            this.spawnPlayerPolice();
          }
          this.wantedDecayTimer=900; // Reset decay timer
        }
      }
    }
  }
};

// Spawn a police car that chases a specific NPC
GameEngine.prototype.spawnPoliceChase=function(targetNpc){
  // Find NPC index
  var npcIdx=-1;
  for(var i=0;i<this.npcs.length;i++){if(this.npcs[i]===targetNpc){npcIdx=i;break}}
  if(npcIdx<0)return;
  // Spawn police car from a road tile away
  var crashTX=targetNpc.x/TILE_SIZE|0,crashTY=targetNpc.y/TILE_SIZE|0;
  var bestTile=null,bestDist=0;
  for(var i=0;i<this.roadTiles.length;i++){
    var t=this.roadTiles[i];
    var dx=t.x-crashTX,dy=t.y-crashTY,d=dx*dx+dy*dy;
    if(d>36&&d<400&&this.map[t.y][t.x]>=1&&this.map[t.y][t.x]<=3){
      if(d>bestDist){bestDist=d;bestTile=t}
    }
  }
  if(!bestTile)bestTile=this.roadTiles[Math.floor(Math.random()*this.roadTiles.length)];
  var spawnX=bestTile.x*TILE_SIZE+TILE_SIZE/2;
  var spawnY=bestTile.y*TILE_SIZE+TILE_SIZE/2;
  var sdx=targetNpc.x-spawnX,sdy=targetNpc.y-spawnY;
  var spawnAngle=Math.atan2(sdx,-sdy);
  var exTile=this.roadTiles[Math.floor(Math.random()*this.roadTiles.length)];

  this.emergencyVehicles.push({
    type:'police',
    x:spawnX,y:spawnY,
    angle:spawnAngle,driftAngle:spawnAngle,
    speed:0,maxSpeed:6,accel:0.1,
    state:'driving',
    targetX:targetNpc.x,targetY:targetNpc.y,
    npcIndex:npcIdx,pedIndex:-1,
    loadTimer:0,flashTimer:0,sirenPhase:0,
    exitX:exTile.x*TILE_SIZE+TILE_SIZE/2,exitY:exTile.y*TILE_SIZE+TILE_SIZE/2,
    chaseTimer:0,chaseDuration:600 // chase for ~10 seconds
  });
  this.emergencyNotify='ПОЛИЦИЯ: ПРЕСЛЕДОВАНИЕ НАРУШИТЕЛЯ';
  this.emergencyNotifyTimer=120;
};

// ============================================================
// PLAYER POLICE CHASE — Police cars chase the player when wanted
// Stars from hitting pedestrians, BUSTED if caught
// ============================================================

GameEngine.prototype.getPlayerPoliceCount=function(){
  var wl=this.wantedLevel|0;
  if(wl<=0)return 0;
  if(wl===1)return 1;
  if(wl===2)return 2;
  if(wl===3)return 3;
  if(wl===4)return 4;
  return 5; // 5 stars = 5 police cars
};

GameEngine.prototype.spawnPlayerPolice=function(){
  var desired=this.getPlayerPoliceCount();
  // Add more police if needed
  while(this.playerPolice.length<desired){
    var p=this.player;
    // Spawn on a road tile 400-600px away from player
    var bestTile=null,bestDist=0;
    var ptx=p.x/TILE_SIZE|0,pty=p.y/TILE_SIZE|0;
    for(var i=0;i<this.roadTiles.length;i++){
      var t=this.roadTiles[i];
      var dx=t.x-ptx,dy=t.y-pty,d=dx*dx+dy*dy;
      if(d>36&&d<400&&this.map[t.y][t.x]>=1&&this.map[t.y][t.x]<=3){
        if(d>bestDist){bestDist=d;bestTile=t}
      }
    }
    if(!bestTile)bestTile=this.roadTiles[Math.floor(Math.random()*this.roadTiles.length)];
    var sx=bestTile.x*TILE_SIZE+TILE_SIZE/2;
    var sy=bestTile.y*TILE_SIZE+TILE_SIZE/2;
    var sdx=p.x-sx,sdy=p.y-sy;
    var sAngle=Math.atan2(sdx,-sdy);
    this.playerPolice.push({
      x:sx,y:sy,angle:sAngle,driftAngle:sAngle,
      speed:0,
      maxSpeed:5+this.wantedLevel*0.5,
      accel:0.1,
      sirenPhase:Math.random()*Math.PI*2,
      flashTimer:0,
      shootTimer:0
    });
  }
  // Remove excess police
  while(this.playerPolice.length>desired){
    this.playerPolice.pop();
  }
};

GameEngine.prototype.updatePlayerPolice=function(dt){
  var wl=this.wantedLevel|0;
  if(wl<=0){
    // No wanted level — remove all player police
    this.playerPolice=[];
    this.bustedTimer=0;
    return;
  }
  this.sirenFlash+=dt;
  // Ensure correct number of police
  this.spawnPlayerPolice();

  var p=this.player;
  for(var i=0;i<this.playerPolice.length;i++){
    var cop=this.playerPolice[i];
    cop.sirenPhase+=dt*0.3;
    cop.flashTimer+=dt;

    var dx=p.x-cop.x,dy=p.y-cop.y;
    var dist=Math.sqrt(dx*dx+dy*dy);
    var targetAngle=Math.atan2(dx,-dy);

    // Steer toward player
    var ad=targetAngle-cop.angle;
    if(ad>Math.PI)ad-=Math.PI*2;
    else if(ad<-Math.PI)ad+=Math.PI*2;
    // Turn rate depends on wanted level — more aggressive at higher stars
    var turnRate=0.04+wl*0.01;
    cop.angle+=(ad>0?1:-1)*Math.min(Math.abs(ad),turnRate*dt);

    // Speed control
    if(dist>80){
      cop.speed=Math.min(cop.speed+cop.accel*dt,cop.maxSpeed);
    }else if(dist>40){
      cop.speed=Math.min(cop.speed+cop.accel*0.5*dt,cop.maxSpeed*0.6);
    }else{
      cop.speed=Math.max(cop.speed-cop.accel*dt,0.5);
    }

    // Move
    var nx=cop.x+Math.sin(cop.angle)*cop.speed*dt;
    var ny=cop.y-Math.cos(cop.angle)*cop.speed*dt;
    var ntx=nx/TILE_SIZE|0,nty=ny/TILE_SIZE|0;
    if(ntx>=0&&ntx<MAP_W&&nty>=0&&nty<MAP_H&&this.isDrivable(this.map[nty][ntx])){
      cop.x=nx;cop.y=ny;
    }else{
      // Try alternate angles to find road
      var found=false;
      for(var a=-1.5;a<=1.5;a+=0.3){
        var tx2=cop.x+Math.sin(cop.angle+a)*cop.speed*dt*2;
        var ty2=cop.y-Math.cos(cop.angle+a)*cop.speed*dt*2;
        var ttx=tx2/TILE_SIZE|0,tty=ty2/TILE_SIZE|0;
        if(ttx>=0&&ttx<MAP_W&&tty>=0&&tty<MAP_H&&this.isDrivable(this.map[tty][ttx])){
          cop.angle+=a*0.3;
          cop.x=tx2;cop.y=ty2;
          found=true;break;
        }
      }
      if(!found){cop.speed*=0.3;cop.angle+=Math.PI*0.2;}
    }
    cop.x=Math.max(CAR_W,Math.min(MAP_W*TILE_SIZE-CAR_W,cop.x));
    cop.y=Math.max(CAR_H,Math.min(MAP_H*TILE_SIZE-CAR_H,cop.y));
    cop.driftAngle=cop.angle;

    // Collision with player
    if(dist<30){
      var pushAngle=Math.atan2(dy,dx);
      p.x+=Math.cos(pushAngle)*2;
      p.y+=Math.sin(pushAngle)*2;
      if(Math.abs(p.speed)>2){
        p.health=Math.max(0,p.health-1);
        p.speed*=0.7;
        this.spawnParticles((p.x+cop.x)/2,(p.y+cop.y)/2,6,'#ff6633',5,15);
        this.shakeAmount=Math.min(10,this.shakeAmount+5);
      }
    }

    // Busted check — police near + player slow/stopped
    if(dist<35&&Math.abs(p.speed)<0.5){
      this.bustedTimer+=dt;
    }else{
      this.bustedTimer=Math.max(0,this.bustedTimer-dt*2);
    }

    // Shooting at high wanted levels
    if(wl>=3&&dist<120&&dist>30){
      cop.shootTimer-=dt;
      if(cop.shootTimer<=0){
        cop.shootTimer=25+Math.floor(Math.random()*20);
        if(Math.random()<0.12+wl*0.04){
          p.health=Math.max(0,p.health-2);
          this.spawnParticles(p.x+(-5+Math.random()*10),p.y+(-5+Math.random()*10),3,'#ffcc00',4,10);
          this.shakeAmount=Math.min(8,this.shakeAmount+2);
        }
        // Bullet trail particles
        for(var b=0;b<3;b++){
          var bt=b/3;
          if(this.particles.length<MAX_PARTICLES){
            this.particles.push({x:cop.x+(p.x-cop.x)*bt+(-2+Math.random()*4),y:cop.y+(p.y-cop.y)*bt+(-2+Math.random()*4),vx:0,vy:0,life:6,maxLife:6,color:'#ff8',size:1.5});
          }
        }
      }
    }

    // Siren particles
    if(this.particles.length<MAX_PARTICLES&&Math.random()<0.15){
      var pColor=Math.sin(cop.flashTimer*0.5)>0?'#ff0000':'#0044ff';
      this.particles.push({x:cop.x+(Math.random()-0.5)*CAR_W,y:cop.y+(Math.random()-0.5)*CAR_H*0.3,vx:(Math.random()-0.5)*0.5,vy:-0.5-Math.random()*0.5,life:8,maxLife:8,color:pColor,size:2+Math.random()*2});
    }
  }

  // Busted — arrested!
  if(this.bustedTimer>120&&!this.playerDead&&!this.bustedShown){
    this.bustedShown=true;
    this.wantedLevel=0;
    this.playerPolice=[];
    this.bustedTimer=0;
    p.speed=0;
    this.money=Math.max(0,this.money-500);
    if(this.onDeath)this.onDeath(); // Show restart button
  }

  // Wanted decay — only when far from all police
  this.wantedDecayTimer-=dt;
  if(this.wantedDecayTimer<=0){
    var nearPolice=false;
    for(var i=0;i<this.playerPolice.length;i++){
      var cop=this.playerPolice[i];
      var ddx=p.x-cop.x,ddy=p.y-cop.y;
      if(ddx*ddx+ddy*ddy<250000){nearPolice=true;break;} // Within 500px
    }
    if(!nearPolice){
      this.wantedLevel=Math.max(0,this.wantedLevel-0.002*dt);
      if((this.wantedLevel|0)<1){
        this.playerPolice=[];
      }
    }else{
      this.wantedDecayTimer=300; // Reset timer when near police
    }
  }
};

GameEngine.prototype.spawnParticles=function(x,y,count,color,maxSpeed,life){for(var i=0;i<count&&this.particles.length<MAX_PARTICLES;i++)this.particles.push({x:x,y:y,vx:(Math.random()-0.5)*maxSpeed,vy:(Math.random()-0.5)*maxSpeed,life:life,maxLife:life,color:color,size:2+Math.random()*2})};
GameEngine.prototype.spawnExplosion=function(x,y){var cols=['#ff4400','#ff6600','#ffcc00','#ff0000','#ffaa00'];for(var i=0;i<30&&this.particles.length<MAX_PARTICLES;i++){var a=Math.random()*Math.PI*2,s=2+Math.random()*6;this.particles.push({x:x+(Math.random()-0.5)*10,y:y+(Math.random()-0.5)*10,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:30+Math.random()*30,maxLife:60,color:cols[Math.floor(Math.random()*cols.length)],size:3+Math.random()*6})}for(var i=0;i<15&&this.particles.length<MAX_PARTICLES;i++)this.particles.push({x:x+(Math.random()-0.5)*20,y:y+(Math.random()-0.5)*20,vx:(Math.random()-0.5)*2,vy:-1-Math.random()*3,life:50+Math.random()*50,maxLife:100,color:'#333',size:5+Math.random()*8});for(var i=0;i<8&&this.particles.length<MAX_PARTICLES;i++){var a=Math.random()*Math.PI*2,s=3+Math.random()*5;this.particles.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:40+Math.random()*40,maxLife:80,color:'#1a1a1a',size:2+Math.random()*3})}};

GameEngine.prototype.updateParticles=function(dt){
  var wi=0;for(var i=0;i<this.particles.length;i++){var pt=this.particles[i];pt.x+=pt.vx*dt;pt.y+=pt.vy*dt;pt.life-=dt;pt.vx*=0.95;pt.vy*=0.95;if(pt.life>0)this.particles[wi++]=pt}this.particles.length=wi;
  wi=0;for(var i=0;i<this.skidMarks.length;i++){var s=this.skidMarks[i];s.alpha-=0.002*dt;if(s.alpha>0)this.skidMarks[wi++]=s}this.skidMarks.length=wi;
};

GameEngine.prototype.updateCamera=function(dt){
  var p=this.player,c=this.camera;
  // Look-ahead: camera looks in the direction the car is moving
  var speedRatio=Math.min(Math.abs(p.speed)/p.maxSpeed,1);
  var lookDist=120*speedRatio; // How far ahead to look
  var targetLA_X=Math.sin(p.driftAngle)*lookDist;
  var targetLA_Y=-Math.cos(p.driftAngle)*lookDist;
  // Smooth look-ahead transition
  c.lookAheadX+=(targetLA_X-c.lookAheadX)*0.06*dt;
  c.lookAheadY+=(targetLA_Y-c.lookAheadY)*0.06*dt;
  // Target camera position = player + look-ahead
  var targetX=p.x+c.lookAheadX;
  var targetY=p.y+c.lookAheadY;
  // Smooth camera follow (faster when player is far from camera)
  var dx=targetX-c.x,dy=targetY-c.y;
  var followSpeed=0.08+speedRatio*0.04; // Faster follow at high speed
  c.x+=dx*followSpeed*dt;
  c.y+=dy*followSpeed*dt;
  // Zoom: slight zoom out at high speed for wider view
  c.targetZoom=1-speedRatio*0.08; // 1.0 at rest, 0.92 at max speed
  c.zoom+=(c.targetZoom-c.zoom)*0.05*dt;
  // Shake decay
  this.shakeAmount*=0.92;
};

// ============ RENDER ============
GameEngine.prototype.render=function(){
  var ctx=this.ctx,w=this.cachedWidth,h=this.cachedHeight;if(w===0||h===0)return;
  var sx=0,sy=0;if(this.shakeAmount>0.5){sx=(Math.random()-0.5)*this.shakeAmount;sy=(Math.random()-0.5)*this.shakeAmount}
  ctx.fillStyle='#1a1a2e';ctx.fillRect(0,0,w,h);ctx.save();
  // Apply zoom centered on screen
  var z=this.camera.zoom;
  ctx.translate(w*0.5,h*0.5);ctx.scale(z,z);ctx.translate(-w*0.5,-h*0.5);
  ctx.translate(w*0.5-this.camera.x+sx,h*0.5-this.camera.y+sy);
  var hw=w*0.5/z,hh=h*0.5/z; // Adjust visible area for zoom
  var vl=Math.max(0,((this.camera.x-hw)/TILE_SIZE|0)-2),vr=Math.min(MAP_W,((this.camera.x+hw)/TILE_SIZE|0)+3);
  var vt=Math.max(0,((this.camera.y-hh)/TILE_SIZE|0)-2),vb=Math.min(MAP_H,((this.camera.y+hh)/TILE_SIZE|0)+3);
  var map=this.map,ts=this.tileSprites;
  for(var y=vt;y<vb;y++){var row=map[y],yp=y*TILE_SIZE;for(var x=vl;x<vr;x++){var spr=ts[row[x]];if(spr)ctx.drawImage(spr,x*TILE_SIZE,yp,TILE_SIZE,TILE_SIZE)}}
  var skids=this.skidMarks;for(var i=0,len=skids.length;i<len;i++){var sk=skids[i];ctx.save();ctx.translate(sk.x,sk.y);ctx.rotate(sk.angle);ctx.fillStyle='rgba(30,30,30,'+sk.alpha+')';ctx.fillRect(-3,-1,6,2);ctx.restore()}

  // ========= MISSION MARKERS (in-world) =========
  var t=this.time;
  // Available mission markers
  for(var i=0;i<this.missions.length;i++){
    var m=this.missions[i];if(m.state!=='available')continue;
    var pulse=0.6+0.4*Math.sin(t*0.15+i*1.2);
    ctx.save();ctx.translate(m.markerX,m.markerY);
    // Beacon glow
    ctx.fillStyle=m.color;ctx.globalAlpha=0.15*pulse;ctx.beginPath();ctx.arc(0,0,40,0,6.2832);ctx.fill();
    // Diamond shape
    ctx.globalAlpha=0.9;ctx.fillStyle=m.color;ctx.beginPath();
    ctx.moveTo(0,-18);ctx.lineTo(14,0);ctx.lineTo(0,18);ctx.lineTo(-14,0);ctx.closePath();ctx.fill();
    ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.globalAlpha=0.7;ctx.stroke();
    // Letter
    ctx.globalAlpha=1;ctx.fillStyle='#fff';ctx.font='bold 12px monospace';ctx.textAlign='center';ctx.textBaseline='middle';
    var labels=['R','G','D','H','T'];
    ctx.fillText(labels[m.id],0,1);
    ctx.restore();
  }

  // Active mission waypoints/checkpoints
  if(this.activeMission){
    var am=this.activeMission;
    // Race checkpoints
    if(am.type==='race'){
      for(var i=this.missionCurrentCP;i<this.missionCheckpoints.length;i++){
        var cp=this.missionCheckpoints[i];
        var isActive=i===this.missionCurrentCP;
        ctx.save();ctx.translate(cp.x,cp.y);
        var p2=0.7+0.3*Math.sin(t*0.2+i);
        // Outer glow - bigger for active
        ctx.fillStyle=isActive?'#ffcc00':'#886600';ctx.globalAlpha=isActive?0.35*p2:0.15;
        ctx.beginPath();ctx.arc(0,0,isActive?55:35,0,6.2832);ctx.fill();
        // Ring
        ctx.globalAlpha=isActive?1:0.5;ctx.strokeStyle='#ffcc00';ctx.lineWidth=isActive?3:2;
        ctx.beginPath();ctx.arc(0,0,isActive?28:16,0,6.2832);ctx.stroke();
        // Center dot
        ctx.fillStyle='#ffcc00';ctx.beginPath();ctx.arc(0,0,isActive?10:6,0,6.2832);ctx.fill();
        ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke();
        if(isActive){ctx.fillStyle='#fff';ctx.font='bold 12px monospace';ctx.textAlign='center';ctx.fillText('CP '+(this.missionCurrentCP+1)+'/'+this.missionCheckpoints.length,0,-35)}
        ctx.restore();
      }
    }
    // Waypoints (getaway/delivery/taxi)
    if(this.missionWaypoints.length>0&&am.type!=='race'){
      var startIdx=am.type==='delivery'?this.missionCurrentCP:(am.type==='taxi'?this.missionCurrentCP:0);
      for(var i=startIdx;i<this.missionWaypoints.length;i++){
        var wp=this.missionWaypoints[i];var isActive=i===startIdx;
        ctx.save();ctx.translate(wp.x,wp.y);
        var p2=0.7+0.3*Math.sin(t*0.18+i*0.8);
        ctx.fillStyle=isActive?am.color:'#555';ctx.globalAlpha=isActive?0.35*p2:0.15;
        ctx.beginPath();ctx.arc(0,0,isActive?55:35,0,6.2832);ctx.fill();
        ctx.globalAlpha=isActive?1:0.4;ctx.fillStyle=isActive?am.color:'#888';
        ctx.beginPath();ctx.arc(0,0,isActive?10:6,0,6.2832);ctx.fill();
        ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke();
        if(isActive&&wp.label){ctx.fillStyle='#fff';ctx.font='bold 10px monospace';ctx.textAlign='center';ctx.fillText(wp.label,0,-30)}
        ctx.restore();
      }
    }
    // Hitman target NPC
    if(am.type==='hitman'&&this.missionNpc&&!this.missionNpc.dead){
      var tn=this.missionNpc;

  // NPC cars

  // Pedestrians

      var waveR=30+((ev.sirenPhase*8)%40);

      else if(ev.type==='medic'||ev.type==='ped_medic')ctx.strokeStyle='rgba(255,0,0,'+waveA+')';

  this.renderHUD(w,h);

GameEngine.prototype.renderHUD=function(w,h){

  ctx.fillStyle='rgba(0,0,0,0.7)';ctx.fillRect(10,h-60,140,50);ctx.fillStyle='#fff';ctx.font='bold 28px monospace';ctx.textAlign='left';ctx.fillText(''+kmh,20,h-25);
  ctx.font='14px monospace';ctx.fillStyle='#aaa';ctx.fillText('km/h',95,h-25);
  var sp=Math.abs(p.speed)/p.maxSpeed;ctx.fillStyle='#333';ctx.fillRect(20,h-18,110,6);ctx.fillStyle=sp>0.8?'#ff4444':'#44ccff';ctx.fillRect(20,h-18,110*sp,6);
  // Money
  ctx.fillStyle='rgba(0,0,0,0.7)';ctx.fillRect(w-180,h-60,170,50);ctx.textAlign='right';ctx.fillStyle='#ffcc44';ctx.font='bold 16px monospace';ctx.fillText('$'+(this.money+this.score),w-20,h-35);
  ctx.fillStyle='#aaa';ctx.font='12px monospace';ctx.fillText('SCORE: '+this.score,w-20,h-16);
  // Minimap

    this.minimapCtx.clearRect(0,0,MINIMAP_SIZE,MINIMAP_SIZE);this.renderMinimapBase();var ms=MINIMAP_SIZE/MAP_W;

    this.minimapCtx.fillStyle='#ff2222';this.minimapCtx.beginPath();this.minimapCtx.arc((p.x/TILE_SIZE)*ms,(p.y/TILE_SIZE)*ms,3,0,6.2832);this.minimapCtx.fill();
    // NPC dots
    this.minimapCtx.fillStyle='#4488ff';for(var i=0;i<this.npcs.length;i++){if(this.npcs[i].dead)continue;this.minimapCtx.beginPath();this.minimapCtx.arc((this.npcs[i].x/TILE_SIZE)*ms,(this.npcs[i].y/TILE_SIZE)*ms,2,0,6.2832);this.minimapCtx.fill()}
    // Emergency vehicle dots on minimap
    for(var i=0;i<this.emergencyVehicles.length;i++){var ev=this.emergencyVehicles[i];this.minimapCtx.fillStyle=ev.type==='medic'||ev.type==='ped_medic'?'#ff0000':ev.type==='police'?'#0044ff':'#ffaa00';this.minimapCtx.beginPath();this.minimapCtx.arc((ev.x/TILE_SIZE)*ms,(ev.y/TILE_SIZE)*ms,3,0,6.2832);this.minimapCtx.fill()}
    // Player police on minimap
    for(var i=0;i<this.playerPolice.length;i++){var pc=this.playerPolice[i];this.minimapCtx.fillStyle='#0044ff';this.minimapCtx.beginPath();this.minimapCtx.arc((pc.x/TILE_SIZE)*ms,(pc.y/TILE_SIZE)*ms,3,0,6.2832);this.minimapCtx.fill()}
  }
  ctx.strokeStyle='#888';ctx.lineWidth=1;ctx.strokeRect(mx,my,MINIMAP_SIZE,MINIMAP_SIZE);

  // ========= MISSION HUD =========
  if(this.activeMission){
    var am=this.activeMission;
    // Mission name bar at top center
    var barW=Math.min(400,w*0.5),barH=52;var barX=(w-barW)/2,barY=40;
    ctx.fillStyle='rgba(0,0,0,0.8)';ctx.fillRect(barX,barY,barW,barH);
    ctx.strokeStyle=am.color;ctx.lineWidth=2;ctx.strokeRect(barX,barY,barW,barH);
    ctx.fillStyle=am.color;ctx.font='bold 14px monospace';ctx.textAlign='center';ctx.fillText(am.name,w/2,barY+18);
    // Objective text
    var objText='';
    switch(am.type){
      case 'race':objText='\u0427\u0435\u043A\u043F\u043E\u0438\u043D\u0442 '+(this.missionCurrentCP+1)+'/'+this.missionCheckpoints.length;break;
      case 'getaway':objText='\u0414\u043E\u0431\u0435\u0440\u0438\u0441\u044C \u0434\u043E \u0443\u0431\u0435\u0436\u0438\u0449\u0430!';break;
      case 'delivery':objText='\u041F\u043E\u0441\u044B\u043B\u043A\u0430 '+this.missionCollected+'/3'+(this.missionCurrentCP>=3?' \u0414\u043E\u0441\u0442\u0430\u0432\u044C \u043D\u0430 \u0441\u043A\u043B\u0430\u0434!':'');break;
      case 'hitman':objText='\u0417\u0434\u043E\u0440\u043E\u0432\u044C\u0435 \u0446\u0435\u043B\u0438: '+Math.max(0,this.missionNpc?this.missionNpc.health|0:0);break;
      case 'taxi':objText='\u041F\u0430\u0441\u0441\u0430\u0436\u0438\u0440\u043E\u0432: '+this.missionPassengers+'/3';break;
    }
    ctx.fillStyle='#fff';ctx.font='12px monospace';ctx.fillText(objText,w/2,barY+38);
    // Timer
    if(this.missionTimer>0){
      var secs=Math.ceil(this.missionTimer/60);var mins=secs/60|0;var sec=secs%60;
      var timeStr=mins+':'+(sec<10?'0':'')+sec;
      ctx.fillStyle=this.missionTimer<600?'#ff4444':'#ffcc44';ctx.font='bold 18px monospace';ctx.textAlign='center';ctx.fillText(timeStr,w/2,barY+barH+20);
    }
    // Direction arrow to next objective
    var targetX=null,targetY=null;
    if(am.type==='race'&&this.missionCurrentCP<this.missionCheckpoints.length){
      var cp=this.missionCheckpoints[this.missionCurrentCP];targetX=cp.x;targetY=cp.y;
    }else if(am.type!=='race'&&this.missionWaypoints.length>0){
      var si=am.type==='delivery'?this.missionCurrentCP:(am.type==='taxi'?this.missionCurrentCP:0);
      if(si<this.missionWaypoints.length){var wp=this.missionWaypoints[si];targetX=wp.x;targetY=wp.y}
      else if(am.type==='hitman'&&this.missionNpc&&!this.missionNpc.dead){targetX=this.missionNpc.x;targetY=this.missionNpc.y}
    }
    if(am.type==='hitman'&&this.missionNpc&&!this.missionNpc.dead){targetX=this.missionNpc.x;targetY=this.missionNpc.y}
    if(targetX!==null){
      var tdx=targetX-p.x,tdy=targetY-p.y;
      var tdist=Math.sqrt(tdx*tdx+tdy*tdy);
      if(tdist>80){ // Only show arrow if target is far enough
        var tangle=Math.atan2(tdx,-tdy);
        var arrowDist=Math.min(120,w*0.15);
        var ax=w/2+Math.sin(tangle)*arrowDist,ay=h/2-Math.cos(tangle)*arrowDist;
        ctx.save();ctx.translate(ax,ay);ctx.rotate(tangle);
        ctx.fillStyle=am.color;ctx.globalAlpha=0.8;
        ctx.beginPath();ctx.moveTo(0,-14);ctx.lineTo(10,6);ctx.lineTo(-10,6);ctx.closePath();ctx.fill();
        ctx.globalAlpha=1;ctx.restore();
        // Distance text
        var distTiles=Math.round(tdist/TILE_SIZE);
        ctx.fillStyle=am.color;ctx.font='bold 11px monospace';ctx.textAlign='center';
        ctx.fillText(distTiles+'m',ax+Math.sin(tangle)*20,ay-Math.cos(tangle)*20+4);
      }
    }
  }

  // Checkpoint flash effect
  if(this.checkpointFlash>0){
    var cfA=this.checkpointFlash/30*0.3;
    ctx.fillStyle='rgba(255,204,0,'+cfA+')';ctx.fillRect(0,0,w,h);
  }

  // Mission intro
  if(this.missionIntroTimer>0&&this.activeMission){
    var am=this.activeMission;var alpha=Math.min(1,this.missionIntroTimer/40);
    ctx.fillStyle='rgba(0,0,0,'+(0.7*alpha)+')';ctx.fillRect(0,h*0.3,w,h*0.25);
    ctx.globalAlpha=alpha;ctx.fillStyle=am.color;ctx.font='bold '+Math.min(w*0.06,36)+'px monospace';ctx.textAlign='center';ctx.fillText(am.name,w/2,h*0.42);
    ctx.fillStyle='#fff';ctx.font=Math.min(w*0.025,16)+'px monospace';ctx.fillText(am.desc,w/2,h*0.5);
    ctx.fillStyle='#ffcc44';ctx.font='bold '+Math.min(w*0.02,14)+'px monospace';ctx.fillText('\u041D\u0430\u0433\u0440\u0430\u0434\u0430: $'+am.reward,w/2,h*0.55);
    ctx.fillStyle='#888';ctx.font=Math.min(w*0.015,11)+'px monospace';ctx.fillText('E / \u0422\u0410\u041F - \u041F\u0420\u041E\u041F\u0423\u0421\u0422\u0418\u0422\u042C',w/2,h*0.59);
    ctx.globalAlpha=1;
  }

  // Mission complete
  if(this.missionCompleteTimer>0){
    var alpha=Math.min(1,this.missionCompleteTimer/30);
    ctx.fillStyle='rgba(0,0,0,'+(0.6*alpha)+')';ctx.fillRect(0,h*0.35,w,h*0.2);
    ctx.globalAlpha=alpha;ctx.fillStyle='#44ff44';ctx.font='bold '+Math.min(w*0.06,36)+'px monospace';ctx.textAlign='center';ctx.fillText('\u041C\u0418\u0421\u0421\u0418\u042F \u0412\u042B\u041F\u041E\u041B\u041D\u0415\u041D\u0410!',w/2,h*0.44);
    ctx.fillStyle='#ffcc44';ctx.font='bold '+Math.min(w*0.03,20)+'px monospace';ctx.fillText('+$'+this.lastCompletedReward,w/2,h*0.51);
    ctx.globalAlpha=1;
  }

  // Mission failed
  if(this.missionFailedTimer>0){
    var alpha=Math.min(1,this.missionFailedTimer/30);
    ctx.fillStyle='rgba(80,0,0,'+(0.6*alpha)+')';ctx.fillRect(0,h*0.35,w,h*0.2);
    ctx.globalAlpha=alpha;ctx.fillStyle='#ff4444';ctx.font='bold '+Math.min(w*0.06,36)+'px monospace';ctx.textAlign='center';ctx.fillText('\u041C\u0418\u0421\u0421\u0418\u042F \u041F\u0420\u041E\u0412\u0410\u041B\u0415\u041D\u0410!',w/2,h*0.44);
    ctx.fillStyle='#aaa';ctx.font=Math.min(w*0.02,14)+'px monospace';ctx.fillText('\u041C\u043E\u0436\u043D\u043E \u043F\u043E\u0432\u0442\u043E\u0440\u0438\u0442\u044C - \u0432\u0435\u0440\u043D\u0438\u0442\u0435\u0441\u044C \u043A \u043C\u0435\u0442\u043A\u0435!',w/2,h*0.51);
    ctx.globalAlpha=1;
  }

  // Mission hint when near available marker
  if(!this.activeMission){
    for(var i=0;i<this.missions.length;i++){
      var m=this.missions[i];if(m.state!=='available')continue;
      var dx=p.x-m.markerX,dy=p.y-m.markerY;
      if(dx*dx+dy*dy<25000){
        ctx.fillStyle='rgba(0,0,0,0.7)';ctx.fillRect(w/2-120,h*0.7,240,36);
        ctx.strokeStyle=m.color;ctx.lineWidth=1;ctx.strokeRect(w/2-120,h*0.7,240,36);
        ctx.fillStyle=m.color;ctx.font='bold 12px monospace';ctx.textAlign='center';ctx.fillText(m.name+': \u0412\u042A\u0415\u0417\u0416\u0410\u0419!',w/2,h*0.7+23);break;
      }
    }
  }

  // Emergency dispatch notification
  if(this.emergencyNotifyTimer>0&&this.emergencyNotify){
    var enAlpha=Math.min(1,this.emergencyNotifyTimer/30);
    var isMedic=this.emergencyNotify.indexOf('СКОРАЯ')>=0||this.emergencyNotify.indexOf('МЕДИК')>=0;
    var isPolice=this.emergencyNotify.indexOf('ПОЛИЦИЯ')>=0;
    var enColor=isMedic?'#ff4444':isPolice?'#4488ff':'#ffaa00';
    var barW=Math.min(350,w*0.6),barH=40;
    var barX=(w-barW)/2,barY=h*0.18;
    ctx.fillStyle='rgba(0,0,0,'+(0.75*enAlpha)+')';ctx.fillRect(barX,barY,barW,barH);
    ctx.strokeStyle=enColor;ctx.lineWidth=2;ctx.globalAlpha=enAlpha;ctx.strokeRect(barX,barY,barW,barH);
    // Flashing icon
    var iconFlash=Math.sin(this.time*0.5)>0;
    ctx.fillStyle=iconFlash?enColor:'#fff';ctx.font='bold 14px monospace';ctx.textAlign='left';
    ctx.fillText(iconFlash?'\u26A5':'\u2622',barX+10,barY+26);
    // Notification text
    ctx.fillStyle='#fff';ctx.font='bold 13px monospace';ctx.textAlign='center';
    ctx.fillText(this.emergencyNotify,w/2,barY+26);
    ctx.globalAlpha=1;
  }

  // Active emergency vehicle indicators (small HUD icons)
  for(var ei=0;ei<this.emergencyVehicles.length;ei++){
    var aev=this.emergencyVehicles[ei];
    if(aev.state==='driving'){
      var eDist=Math.sqrt((aev.x-p.x)*(aev.x-p.x)+(aev.y-p.y)*(aev.y-p.y));
      if(eDist>200){
        var eAngle=Math.atan2(aev.x-p.x,-(aev.y-p.y));
        var eIconDist=Math.min(80,w*0.1);
        var eix=w/2+Math.sin(eAngle)*eIconDist,eiy=h/2-Math.cos(eAngle)*eIconDist;
        ctx.save();ctx.translate(eix,eiy);ctx.rotate(eAngle);
        ctx.fillStyle=aev.type==='medic'?'rgba(255,0,0,0.6)':'rgba(255,170,0,0.6)';
        ctx.beginPath();ctx.moveTo(0,-8);ctx.lineTo(6,4);ctx.lineTo(-6,4);ctx.closePath();ctx.fill();
        ctx.restore();
      }
    }
  }
};

GameEngine.prototype.renderWastedOverlay=function(w,h){
  var ctx=this.ctx,t=this.deathTime;
  var alpha=Math.min(0.7,t*0.015);ctx.fillStyle='rgba(100,0,0,'+alpha+')';ctx.fillRect(0,0,w,h);
  if(t>30){
    var ta=Math.min(1,(t-30)*0.03),scale=1+Math.max(0,0.5-(t-30)*0.01);
    ctx.save();ctx.translate(w*0.5,h*0.4);ctx.scale(scale,scale);ctx.globalAlpha=ta;
    ctx.fillStyle='#000';ctx.font='bold '+Math.min(w*0.15,120)+'px Arial';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('WASTED',4,4);
    ctx.fillStyle='#cc2222';ctx.fillText('WASTED',0,0);ctx.globalAlpha=1;ctx.restore();
    if(t>60){ctx.globalAlpha=Math.min(1,(t-60)*0.05);ctx.fillStyle='#aaa';ctx.font=Math.min(w*0.03,20)+'px monospace';ctx.textAlign='center';ctx.fillText('\u041D\u0430\u0436\u043C\u0438\u0442\u0435 R \u0438\u043B\u0438 \u043A\u043D\u043E\u043F\u043A\u0443 \u0434\u043B\u044F \u043F\u0435\u0440\u0435\u0437\u0430\u043F\u0443\u0441\u043A\u0430',w*0.5,h*0.55);ctx.globalAlpha=1}
    if(t>50){ctx.globalAlpha=Math.min(1,(t-50)*0.04);ctx.fillStyle='#ffcc44';ctx.font='bold '+Math.min(w*0.04,28)+'px monospace';ctx.textAlign='center';ctx.fillText('\u0418\u0422\u041E\u0413\u041E: $'+(this.money+this.score)+'  |  SCORE: '+this.score,w*0.5,h*0.65);ctx.globalAlpha=1}
  }
};

GameEngine.prototype.renderBustedOverlay=function(w,h){
  var ctx=this.ctx;
  ctx.fillStyle='rgba(0,0,60,0.8)';ctx.fillRect(0,0,w,h);
  // BUSTED text
  ctx.save();ctx.translate(w*0.5,h*0.38);
  ctx.fillStyle='#000';ctx.font='bold '+Math.min(w*0.13,100)+'px Arial';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('BUSTED',4,4);
  ctx.fillStyle='#4488ff';ctx.fillText('BUSTED',0,0);
  ctx.restore();
  // Info
  ctx.fillStyle='#aac';ctx.font=Math.min(w*0.025,18)+'px monospace';ctx.textAlign='center';
  ctx.fillText('\u041F\u043E\u043B\u0438\u0446\u0438\u044F \u0437\u0430\u0434\u0435\u0440\u0436\u0430\u043B\u0430 \u0432\u0430\u0441!',w*0.5,h*0.5);
  ctx.fillStyle='#ff4444';ctx.font='bold '+Math.min(w*0.03,22)+'px monospace';
  ctx.fillText('\u0428\u0422\u0420\u0410\u0424: -$500',w*0.5,h*0.56);
  ctx.fillStyle='#aaa';ctx.font=Math.min(w*0.02,15)+'px monospace';
  ctx.fillText('\u041D\u0430\u0436\u043C\u0438\u0442\u0435 R \u0438\u043B\u0438 \u043A\u043D\u043E\u043F\u043A\u0443 \u0434\u043B\u044F \u043F\u0440\u043E\u0434\u043E\u043B\u0436\u0435\u043D\u0438\u044F',w*0.5,h*0.63);
};

// ============================================================
// UI CONTROLLER
// ============================================================
(function(){
  var startScreen=document.getElementById('startScreen'),gameContainer=document.getElementById('gameContainer');
  var loadingOverlay=document.getElementById('loadingOverlay');
  var restartBtn=document.getElementById('restartBtn'),touchControls=document.getElementById('touchControls');
  var portraitBlocker=document.getElementById('portraitBlocker'),startBg=document.getElementById('startBg');
  var canvas=document.getElementById('gameCanvas'),engine=null,gameState='start';
  var isTouchDevice='ontouchstart' in window||navigator.maxTouchPoints>0;
  var bh=[120,145,98,167,189,112,198,118,175,182,148,196,142,139,127,82,109,131,176,183];
  for(var i=0;i<bh.length;i++){var div=document.createElement('div');div.style.cssText='position:absolute;left:'+(5+(i%5)*20)+'%;top:'+(20+Math.floor(i/5)*20)+'%;width:60px;height:'+bh[i]+'px;background:hsl('+(220+i*10)+',30%,'+(15+i*2)+'%);border-radius:2px';startBg.appendChild(div)}
  if(isTouchDevice)touchControls.style.display='block';
  // Auto fullscreen + landscape lock
  function goFullscreen(){
    try{var el=document.documentElement;if(!document.fullscreenElement){if(el.requestFullscreen)el.requestFullscreen();else if(el.webkitRequestFullscreen)el.webkitRequestFullscreen();else if(el.msRequestFullscreen)el.msRequestFullscreen()}}catch(e){}
    try{if(screen.orientation&&screen.orientation.lock)screen.orientation.lock('landscape')}catch(e){}
  }
  function checkOrientation(){var l=window.innerWidth>window.innerHeight;if(!l&&isTouchDevice)portraitBlocker.style.display='flex';else portraitBlocker.style.display='none'}
  checkOrientation();window.addEventListener('resize',checkOrientation);window.addEventListener('orientationchange',checkOrientation);if(screen.orientation)screen.orientation.addEventListener('change',checkOrientation);
  function startGame(){gameState='loading';startScreen.style.display='none';gameContainer.style.display='block';loadingOverlay.style.display='flex';restartBtn.style.display='none';
    goFullscreen(); // Auto fullscreen on start
    requestAnimationFrame(function(){engine=new GameEngine(canvas);engine.onReady=function(){gameState='playing';loadingOverlay.style.display='none';engine.start()};
      engine.onDeath=function(){gameState='dead';restartBtn.style.display='block'};
      engine.init().catch(function(){gameState='start';startScreen.style.display='flex';gameContainer.style.display='none'})})}
  function restartGame(){if(engine){engine.bustedShown=false;engine.restart();gameState='playing';restartBtn.style.display='none'}}
  document.getElementById('playBtn').onclick=startGame;restartBtn.onclick=restartGame;
  window.addEventListener('keydown',function(e){if((e.key==='r'||e.key==='R')&&(gameState==='dead'||(engine&&engine.bustedShown))){e.preventDefault();if(engine)engine.bustedShown=false;restartGame();return}if(gameState!=='playing')return;e.preventDefault();if(engine)engine.setKey(e.key,true);if((e.key==='e'||e.key==='E')&&engine&&engine.missionIntroTimer>0)engine.missionIntroTimer=0})
  window.addEventListener('keyup',function(e){if(engine)engine.setKey(e.key,false)});
  function bindTouch(id,action){var el=document.getElementById(id);el.addEventListener('touchstart',function(e){e.preventDefault();if(engine)engine.setTouch(action,true)});el.addEventListener('touchend',function(){if(engine)engine.setTouch(action,false)});el.addEventListener('touchcancel',function(){if(engine)engine.setTouch(action,false)})}
  bindTouch('tLeft','left');bindTouch('tRight','right');bindTouch('tGas','up');bindTouch('tBrk','brake');bindTouch('tRev','down');
  // Tap to skip mission intro
  canvas.addEventListener('touchstart',function(){if(engine&&engine.missionIntroTimer>0)engine.missionIntroTimer=0});
  if('serviceWorker' in navigator){
    window.addEventListener('load',function(){
      navigator.serviceWorker.register('./sw.js',{scope:'./'}).then(function(reg){
        console.log('SW registered:',reg.scope);
        reg.update();
      }).catch(function(err){console.log('SW registration failed:',err)});
    });
  }
})();
</script>
