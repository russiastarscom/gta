h.random()>0.5?'#ffdd44':'#ffaa22'):'#1a1a2a';c.fillRect(8+cc*14,8+r*18,8,10)}c.fillStyle='#5a5a6a';c.fillRect(w/2-6,h-14,12,14)},TS,TS),self.loadOrGenerate('assets/tiles/park.png',function(c,w,h){c.fillStyle='#2a7a2a';c.fillRect(0,0,w,h);c.fillStyle='#1a5a1a';c.beginPath();c.arc(w*0.3,h*0.4,10,0,Math.PI*2);c.fill();c.beginPath();c.arc(w*0.7,h*0.6,12,0,Math.PI*2);c.fill();c.fillStyle='#5a3a1a';c.fillRect(w*0.3-2,h*0.4,4,15);c.fillRect(w*0.7-2,h*0.6,4,15)},TS,TS),self.loadOrGenerate('assets/tiles/water.png',function(c,w,h){c.fillStyle='#1a4a8a';c.fillRect(0,0,w,h);c.strokeStyle='#2a5a9a';c.lineWidth=2;for(var i=0;i<4;i++){c.beginPath();c.moveTo(0,10+i*16);c.bezierCurveTo(w*0.3,6+i*16,w*0.7,14+i*16,w,10+i*16);c.stroke()}},TS,TS),self.loadOrGenerate('assets/image/player_car.png',function(c,w,h){SpriteGenerator.drawCar(c,w,h,'#cc2222','#991111','#ff4444')},CAR_W,CAR_H),self.loadOrGenerate('assets/image/npc_car1.png',function(c,w,h){SpriteGenerator.drawCar(c,w,h,nc[0][0],nc[0][1],nc[0][2])},CAR_W,CAR_H),self.loadOrGenerate('assets/image/npc_car2.png',function(c,w,h){SpriteGenerator.drawCar(c,w,h,nc[1][0],nc[1][1],nc[1][2])},CAR_W,CAR_H),self.loadOrGenerate('assets/image/npc_car3.png',function(c,w,h){SpriteGenerator.drawCar(c,w,h,nc[2][0],nc[2][1],nc[2][2])},CAR_W,CAR_H),self.loadOrGenerate('assets/image/npc_car4.png',function(c,w,h){SpriteGenerator.drawCar(c,w,h,nc[3][0],nc[3][1],nc[3][2])},CAR_W,CAR_H),self.loadOrGenerate('assets/image/police_car.png',function(c,w,h){SpriteGenerator.drawCar(c,w,h,'#111111','#000000','#333333');c.fillStyle='#ff0000';c.fillRect(w/2-6,8,5,4);c.fillStyle='#0044ff';c.fillRect(w/2+1,8,5,4)},CAR_W,CAR_H),self.loadOrGenerate('assets/image/wrecked_car.png',function(c,w,h){SpriteGenerator.drawCar(c,w,h,'#2a2a2a','#1a1a1a','#333333');c.fillStyle='rgba(0,0,0,0.4)';c.fillRect(4,4,w-8,h-8);c.strokeStyle='#444';c.lineWidth=1;c.beginPath();c.moveTo(w*0.3,h*0.2);c.lineTo(w*0.5,h*0.5);c.stroke();c.beginPath();c.moveTo(w*0.7,h*0.3);c.lineTo(w*0.5,h*0.6);c function generateMap(){var map=[];for(var y=0;y<MAP_H;y++){map[y]=[];for(var x=0;x<MAP_W;x++)map[y][x]=0}var ri=8,roads=[];for(var i=ri;i<MAP_W-2;i+=ri){roads.push(i);roads.push(i+1)}for(var y=0;y<MAP_H;y++)for(var k=0;k<roads.length;k++)if(y===roads[k])for(var x=0;x<MAP_W;x++)map[y][x]=1;for(var x=0;x<MAP_W;x++)for(var k=0;k<roads.length;k++)if(x===roads[k])for(var y=0;y<MAP_H;y++)map[y][x]=map[y][x]===1?3:2;for(var y=0;y<MAP_H;y++)for(var x=0;x<MAP_W;x++){if(map[y][x]>=1&&map[y][x]<=3){for(var dy=-1;dy<=1;dy++)for(var dx=-1;dx<=1;dx++){var ny=y+dy,nx=x+dx;if(ny>=0&&ny<MAP_H&&nx>=0&&nx<MAP_W&&map[ny][nx]===0)map[ny][nx]=4}}}for(var by=0;by<MAP_H;by+=ri)for(var bx=0;bx<MAP_W;bx+=ri){var isPark=Math.random()<0.2;for(var y=by+3;y<Math.min(by+ri-1,MAP_H);y++)for(var x=bx+3;x<Math.min(bx+ri-1,MAP_W);x++)if(map[y][x]===0)map[y][x]=isPark?6:5}for(var y=30;y<36;y++)for(var x=30;x<38;x++){if(y<MAP_H&&x<MAP_W){map[y][x]=7;for(var dy=-1;dy<=1;dy++)for(var dx=-1;dx<=1;dx++){var ny=y+dy,nx=x+dx;if(ny>=0&&ny<MAP_H&&nx>=0&&nx<MAP_W&&map[ny][nx]!==7)map[ny][nx]=4}}}return map}

// ============================================================
// NEURAL NETWORK — Real feedforward NN with BACKPROPAGATION
// No external APIs — real gradient descent training
// No emulation — real loss computation, real weight updates
// ============================================================

// Neural Network with full backpropagation support
function NeuralNetwork(layers){
  this.layers=layers.slice();
  this.weights=[];this.biases=[];
  for(var i=0;i<layers.length-1;i++){
    var scale=Math.sqrt(2.0/layers[i]); // He init
    var w=[];
    for(var j=0;j<layers[i]*layers[i+1];j++)w.push((Math.random()*2-1)*scale);
    this.weights.push(w);
    var b=[];
    for(var j=0;j<layers[i+1];j++)b.push(0.01);
    this.biases.push(b);
  }
  // Backprop cache
  this.cachedZ=[]; // pre-activation values per layer
  this.cachedA=[]; // post-activation values per layer
  // Training stats
  this.fitness=0;
  this.age=0;
  this.distTraveled=0;
  this.roadTime=0;
  this.avgSpeed=0;
  this.lastX=0;this.lastY=0;
  this.totalLoss=0;
  this.trainSteps=0;
}

// Forward pass — stores cache for backprop
NeuralNetwork.prototype.forward=function(inputs){
  this.cachedA=[inputs.slice()];
  this.cachedZ=[];
  var current=inputs;
  for(var i=0;i<this.weights.length;i++){
    var z=[],a=[];
    var w=this.weights[i],b=this.biases[i];
    var inS=this.layers[i],outS=this.layers[i+1];
    for(var j=0;j<outS;j++){
      var sum=b[j];
      for(var k=0;k<inS;k++)sum+=current[k]*w[k*outS+j];
      z.push(sum);
      if(i<this.weights.length-1){
        var sig=1.0/(1.0+Math.exp(-Math.max(-10,Math.min(10,sum))));
        a.push(sum*sig); // Swish
      }else{
        a.push(Math.tanh(sum)); // Output: tanh
      }
    }
    this.cachedZ.push(z);
    this.cachedA.push(a);
    current=a;
  }
  return current;
};

// ========= REAL BACKPROPAGATION =========
// Computes gradients and updates weights using chain rule
NeuralNetwork.prototype.backward=function(targetOutputs,learningRate){
  var L=this.weights.length;
  var deltas=new Array(L);
  
  // Step 1: Output layer delta
  // Loss = 0.5 * sum((target - output)^2)  — MSE
  // dL/doutput = -(target - output) = output - target
  var outLayer=L-1;
  deltas[outLayer]=[];
  var outA=this.cachedA[L];
  for(var j=0;j<this.layers[L];j++){
    var error=outA[j]-targetOutputs[j]; // dL/d(output)
    // tanh derivative: 1 - tanh^2(x)
    var tanhDeriv=1-outA[j]*outA[j];
    deltas[outLayer][j]=error*tanhDeriv; // dL/d(z) for output layer
  }
  
  // Step 2: Hidden layer deltas — backpropagate through chain rule
  for(var l=outLayer-1;l>=0;l--){
    deltas[l]=[];
    for(var j=0;j<this.layers[l+1];j++){
      // Sum deltas from next layer * weights connecting to this neuron
      var error=0;
      for(var k=0;k<this.layers[l+2];k++){
        error+=deltas[l+1][k]*this.weights[l+1][j*this.layers[l+2]+k];
      }
      // Swish derivative: sigmoid(z) * (1 + z * (1 - sigmoid(z)))
      var z=this.cachedZ[l][j];
      var sig=1.0/(1.0+Math.exp(-Math.max(-10,Math.min(10,z))));
      var swishDeriv=sig*(1+z*(1-sig));
      deltas[l][j]=error*swishDeriv;
    }
  }
  
  // Step 3: Update weights and biases using gradients
  // dL/dw[i][j][k] = delta[i][j] * a[i-1][k]
  // w = w - lr * dL/dw
  for(var l=0;l<L;l++){
    for(var j=0;j<this.layers[l+1];j++){
      this.biases[l][j]-=learningRate*deltas[l][j]; // Update bias
      for(var k=0;k<this.layers[l];k++){
        this.weights[l][k*this.layers[l+1]+j]-=learningRate*deltas[l][j]*this.cachedA[l][k]; // Update weight
      }
    }
  }
  
  // Compute loss for stats
  var loss=0;
  for(var j=0;j<this.layers[L];j++){
    var diff=outA[j]-targetOutputs[j];
    loss+=diff*diff;
  }
  this.totalLoss+=loss*0.5;
  this.trainSteps++;
  return loss*0.5;
};

// Train: forward + backward in one call
NeuralNetwork.prototype.train=function(inputs,targetOutputs,learningRate){
  this.forward(inputs);
  return this.backward(targetOutputs,learningRate);
};

// Clone this network
NeuralNetwork.prototype.clone=function(){
  var nn=new NeuralNetwork(this.layers);
  for(var i=0;i<this.weights.length;i++){
    nn.weights[i]=this.weights[i].slice();
    nn.biases[i]=this.biases[i].slice();
  }
  return nn;
};

// Serialize/deserialize for localStorage
NeuralNetwork.prototype.serialize=function(){
  var d={layers:this.layers,w:[],b:[]};
  for(var i=0;i<this.weights.length;i++){d.w.push(this.weights[i].slice());d.b.push(this.biases[i].slice())}
  return JSON.stringify(d);
};
NeuralNetwork.deserialize=function(json){
  var d=JSON.parse(json);
  var nn=new NeuralNetwork(d.layers);
  for(var i=0;i<d.w.length;i++){nn.weights[i]=d.w[i];nn.biases[i]=d.b[i]}
  return nn;
};

// ============================================================
// TEACHER — Expert driver that generates training data
// BFS pathfinding provides GPS, teacher computes correct actions
// This is IMITATION LEARNING: NN learns to copy expert behavior
// ============================================================
function computeTeacherActions(npc,sensors,engine){
  var steer=0,gas=0,speedDesire=0.5,laneFix=0;
  var wpAngle=sensors.waypointAngle; // [-1, 1] normalized
  
  // === WAYPOINT STEERING — turn toward GPS destination ===
  steer=wpAngle*1.8; // Proportional control
  // If turn is sharp, steer harder
  if(Math.abs(wpAngle)>0.5)steer=Math.sign(wpAngle)*Math.min(1,Math.abs(wpAngle)*2.2);
  steer=Math.max(-1,Math.min(1,steer));
  
  // === WALL AVOIDANCE — critical safety override ===
  var frontWall=sensors.road[0];
  var frontLeft=sensors.road[1];
  var frontRight=sensors.road[2];
  var midLeft=sensors.road[3];
  var midRight=sensors.road[4];
  var farLeft=sensors.road[5];
  var farRight=sensors.road[6];
  var midFarLeft=sensors.road[7];
  var midFarRight=sensors.road[8];
  
  if(frontWall<0.3){
    // Wall VERY close ahead — emergency brake + hard steer away
    gas=-1.0;
    speedDesire=0.05;
    steer=frontLeft>frontRight?-0.9:0.9;
  }else if(frontWall<0.5){
    // Wall close ahead — brake and steer
    gas=-0.6;
    speedDesire=0.15;
    // Steer toward the side with more space
    if(frontLeft>frontRight+0.1)steer=Math.min(steer,-0.5);
    else if(frontRight>frontLeft+0.1)steer=Math.max(steer,0.5);
  }else if(frontWall<0.7){
    // Wall medium ahead — slow down, gentle steer
    gas=-0.2;
    speedDesire=0.35;
    // Anticipate: check left/right for clear path
    if(midLeft>midRight+0.15)steer=Math.min(steer,-0.2);
    else if(midRight>midLeft+0.15)steer=Math.max(steer,0.2);
  }else if(frontWall<0.85){
    // Slight wall ahead — moderate speed, keep toward waypoint
    gas=0.2;
    speedDesire=0.5;
  }else{
    // Clear ahead — accelerate
    gas=0.7;
    speedDesire=0.65;
  }
  
  // === OBSTACLE AVOIDANCE — cars and pedestrians ===
  var frontObs=sensors.obstacle[0];
  var leftObs=sensors.obstacle[1];
  var rightObs=sensors.obstacle[2];
  var midLeftObs=sensors.obstacle[3];
  var midRightObs=sensors.obstacle[4];
  
  if(frontObs<0.25){
    // Obstacle very close — hard brake + evade
    gas=Math.min(gas,-0.8);
    speedDesire=0.05;
    if(leftObs>rightObs)steer=Math.min(steer,-0.6);
    else steer=Math.max(steer,0.6);
  }else if(frontObs<0.45){
    // Obstacle medium — brake + gentle evade
    gas=Math.min(gas,-0.3);
    speedDesire=Math.min(speedDesire,0.25);
    if(leftObs>rightObs+0.1)steer=Math.min(steer,-0.3);
    else if(rightObs>leftObs+0.1)steer=Math.max(steer,0.3);
  }else if(frontObs<0.65){
    // Obstacle visible — slow slightly
    gas=Math.min(gas,0.1);
    speedDesire=Math.min(speedDesire,0.4);
  }
  
  // === LANE DISCIPLINE — stay in center of road ===
  if(sensors.onRoad>0.5){
    var myTX=npc.x/TILE_SIZE|0,myTY=npc.y/TILE_SIZE|0;
    if(myTX>=0&&myTX<MAP_W&&myTY>=0&&myTY<MAP_H){
      var tileType=engine.map[myTY][myTX];
      var tCX=myTX*TILE_SIZE+TILE_SIZE/2;
      var tCY=myTY*TILE_SIZE+TILE_SIZE/2;
      var offX=npc.x-tCX,offY=npc.y-tCY;
      
      if(tileType===1){
        // Horizontal road — center in Y
        laneFix=-offY/(TILE_SIZE*0.5);
      }else if(tileType===2){
        // Vertical road — center in X
        laneFix=-offX/(TILE_SIZE*0.5);
      }else if(tileType===3){
        // Cross — center in both
        laneFix=(-offX-offY)/(TILE_SIZE*0.7);
      }
      laneFix=Math.max(-1,Math.min(1,laneFix));
      
      // If very off-center, also adjust steering
      if(Math.abs(offX)>15||Math.abs(offY)>15){
        var toCenterAngle=Math.atan2(tCX-npc.x,-(tCY-npc.y));
        var centerDiff=toCenterAngle-npc.angle;
        if(centerDiff>Math.PI)centerDiff-=Math.PI*2;
        if(centerDiff<-Math.PI)centerDiff+=Math.PI*2;
        steer+=centerDiff*0.5;
        steer=Math.max(-1,Math.min(1,steer));
      }
    }
  }else{
    // Off road — steer back toward road (waypoint)
    gas=Math.min(gas,-0.3);
    speedDesire=0.1;
    laneFix=0;
  }
  
  // === NEXT WAYPOINT LOOK-AHEAD ===
  // If next waypoint is in a different direction, prepare turn
  var nextAngle=sensors.nextWaypointAngle;
  if(Math.abs(nextAngle)>0.4&&sensors.distToWaypoint<0.3){
    // Approaching intersection — slow down for turn
    speedDesire=Math.min(speedDesire,0.35);
    gas=Math.min(gas,0.1);
    // Pre-steer toward next direction
    steer=steer*0.6+nextAngle*0.4;
    steer=Math.max(-1,Math.min(1,steer));
  }
  
  // Convert speedDesire to [-1, 1] range for tanh output
  var speedOut=speedDesire*2-1;
  
  return [steer,gas,speedOut,laneFix];
}

// ============================================================
// REAL TRAINING SYSTEM — Backpropagation + REINFORCE
// Phase 1: Imitation learning (learn from teacher)
// Phase 2: REINFORCE policy gradient (learn from rewards)
// ============================================================
// ============================================================
// SENSOR SYSTEM — Bot's "eyes" for the neural network
// Enhanced: 9 road rays + 7 obstacle rays + compass + distance metrics
// ============================================================
function computeSensors(npc,engine){
  var sensors={road:[],obstacle:[],waypointAngle:0,nextWaypointAngle:0,speed:0,laneOffset:0,onRoad:0,atCross:0,roadType:0,angleDiff:0,distToWaypoint:0};
  // 9 raycast directions for road/wall detection — wider coverage
  var rayAngles=[0, -0.35, 0.35, -0.7, 0.7, -1.1, 1.1, -1.5, 1.5];
  var rayDistances=[100, 85, 85, 70, 70, 55, 55, 45, 45];
  var roadHits=[];
  for(var r=0;r<rayAngles.length;r++){
    var rayAngle=npc.angle+rayAngles[r];
    var maxD=rayDistances[r];
    var hitDist=maxD;
    for(var step=6;step<=maxD;step+=6){
      var rx=npc.x+Math.sin(rayAngle)*step;
      var ry=npc.y-Math.cos(rayAngle)*step;
      var rtx=rx/TILE_SIZE|0,rty=ry/TILE_SIZE|0;
      if(rtx<0||rtx>=MAP_W||rty<0||rty>=MAP_H||!engine.isDrivable(engine.map[rty][rtx])){
        hitDist=step;break;
      }
    }
    roadHits.push(hitDist/maxD);
  }
  sensors.road=roadHits;

  // 7 obstacle detection rays (NPCs + player + pedestrians)
  var obsAngles=[0, -0.3, 0.3, -0.65, 0.65, -1.0, 1.0];
  var obsDist=[];
  for(var r=0;r<obsAngles.length;r++){
    var minDist=1.0;
    // Check NPCs
    for(var j=0;j<engine.npcs.length;j++){
      if(engine.npcs[j]===npc||engine.npcs[j].dead)continue;
      var dx=engine.npcs[j].x-npc.x,dy=engine.npcs[j].y-npc.y;
      var d=Math.sqrt(dx*dx+dy*dy);
      if(d<150){
        var angleToObs=Math.atan2(dx,-dy)-npc.angle;
        if(angleToObs>Math.PI)angleToObs-=Math.PI*2;
        if(angleToObs<-Math.PI)angleToObs+=Math.PI*2;
        var rayDiff=Math.abs(angleToObs-obsAngles[r]);
        if(rayDiff>Math.PI)rayDiff=Math.PI*2-rayDiff;
        if(rayDiff<0.35){
          var norm=d/150;
          if(norm<minDist)minDist=norm;
        }
      }
    }
    // Check player
    var pdx=engine.player.x-npc.x,pdy=engine.player.y-npc.y;
    var pd=Math.sqrt(pdx*pdx+pdy*pdy);
    if(pd<150){
      var pAngleToObs=Math.atan2(pdx,-pdy)-npc.angle;
      if(pAngleToObs>Math.PI)pAngleToObs-=Math.PI*2;
      if(pAngleToObs<-Math.PI)pAngleToObs+=Math.PI*2;
      var pRayDiff=Math.abs(pAngleToObs-obsAngles[r]);
      if(pRayDiff>Math.PI)pRayDiff=Math.PI*2-pRayDiff;
      if(pRayDiff<0.35){
        var pNorm=pd/150;
        if(pNorm<minDist)minDist=pNorm;
      }
    }
    obsDist.push(minDist);
  }
  sensors.obstacle=obsDist;

  // Waypoint direction (from pathfinding GPS)
  var wpAngle=0;
  sensors.distToWaypoint=1;
  if(npc.npc.path&&npc.npc.pathIndex<npc.npc.path.length){
    var wp=npc.npc.path[npc.npc.pathIndex];
    var wpx=wp.x*TILE_SIZE+TILE_SIZE/2;
    var wpy=wp.y*TILE_SIZE+TILE_SIZE/2;
    var wdx=wpx-npc.x,wdy=wpy-npc.y;
    var desiredAngle=Math.atan2(wdx,-wdy);
    wpAngle=desiredAngle-npc.angle;
    if(wpAngle>Math.PI)wpAngle-=Math.PI*2;
    if(wpAngle<-Math.PI)wpAngle+=Math.PI*2;
    wpAngle/=Math.PI;
    sensors.distToWaypoint=Math.min(1,Math.sqrt(wdx*wdx+wdy*wdy)/500);
  }
  sensors.waypointAngle=wpAngle;

  // Next-next waypoint for look-ahead
  var nextWpAngle=0;
  if(npc.npc.path&&npc.npc.pathIndex+1<npc.npc.path.length){
    var nwp=npc.npc.path[npc.npc.pathIndex+1];
    var nwpx=nwp.x*TILE_SIZE+TILE_SIZE/2;
    var nwpy=nwp.y*TILE_SIZE+TILE_SIZE/2;
    var nwdx=nwpx-npc.x,nwdy=nwpy-npc.y;
    var nDesiredAngle=Math.atan2(nwdx,-nwdy);
    nextWpAngle=nDesiredAngle-npc.angle;
    if(nextWpAngle>Math.PI)nextWpAngle-=Math.PI*2;
    if(nextWpAngle<-Math.PI)nextWpAngle+=Math.PI*2;
    nextWpAngle/=Math.PI;
  }
  sensors.nextWaypointAngle=nextWpAngle;

  // Speed (normalized)
  sensors.speed=Math.min(1,Math.abs(npc.speed)/npc.maxSpeed);

  // Current tile info
  var myTX=npc.x/TILE_SIZE|0,myTY=npc.y/TILE_SIZE|0;
  if(myTX>=0&&myTX<MAP_W&&myTY>=0&&myTY<MAP_H){
    var tileType=engine.map[myTY][myTX];
    sensors.onRoad=(tileType>=1&&tileType<=4||tileType===6)?1.0:0.0;
    sensors.atCross=tileType===3?1.0:0.0;
    // Road type encoding: 0=off-road, 0.33=horizontal, 0.66=vertical, 1.0=cross
    if(tileType===1)sensors.roadType=0.33;
    else if(tileType===2)sensors.roadType=0.66;
    else if(tileType===3)sensors.roadType=1.0;
    else sensors.roadType=0;
    var tileCX=myTX*TILE_SIZE+TILE_SIZE/2;
    var tileCY=myTY*TILE_SIZE+TILE_SIZE/2;
    sensors.laneOffset=Math.min(1,Math.sqrt((npc.x-tileCX)*(npc.x-tileCX)+(npc.y-tileCY)*(npc.y-tileCY))/TILE_SIZE);
  }else{
    sensors.onRoad=0;sensors.atCross=0;sensors.laneOffset=1;sensors.roadType=0;
  }
  
  // Angle difference from straight (how much the bot is turning)
  sensors.angleDiff=Math.sin(npc.angle)*0.5+0.5; // Normalized turn signal
  
  return sensors;
}

// Convert sensors to NN input array — 22 inputs for better awareness
function sensorsToInputs(sensors){
  return [
    sensors.road[0], sensors.road[1], sensors.road[2], sensors.road[3], sensors.road[4], sensors.road[5], sensors.road[6], sensors.road[7], sensors.road[8], // 9 road rays
    sensors.obstacle[0], sensors.obstacle[1], sensors.obstacle[2], sensors.obstacle[3], sensors.obstacle[4], sensors.obstacle[5], sensors.obstacle[6], // 7 obstacle rays
    sensors.waypointAngle,   // GPS direction to next waypoint
    sensors.nextWaypointAngle, // GPS direction to waypoint after next
    sensors.speed,            // Current speed
    sensors.laneOffset,       // How far from tile center
    sensors.onRoad,           // Am I on road?
    sensors.roadType,         // What type of road?
    sensors.distToWaypoint    // How far to next waypoint
  ]; // 22 inputs
}

// ============================================================
// GAME ENGINE
// ============================================================
// ============================================================
// REAL SUPERVISED TRAINING — Backpropagation on teacher data
// The NN is trained SILENTLY during game initialization
// Teacher = rule-based AI, Student = neural network
// This is REAL gradient descent: forward pass, loss, backward pass, weight update
// ============================================================

// Simplified teacher that works from sensors only (no map/npc dependency)
function computeTeacherFromSensors(sensors){
  var steer=0,gas=0,speedDesire=0.5,laneFix=0;
  var wpAngle=sensors.waypointAngle;
  steer=wpAngle*1.8;
  if(Math.abs(wpAngle)>0.5)steer=Math.sign(wpAngle)*Math.min(1,Math.abs(wpAngle)*2.2);
  steer=Math.max(-1,Math.min(1,steer));
  var frontWall=sensors.road[0],frontLeft=sensors.road[1],frontRight=sensors.road[2];
  var midLeft=sensors.road[3],midRight=sensors.road[4];
  if(frontWall<0.3){gas=-1.0;speedDesire=0.05;steer=frontLeft>frontRight?-0.9:0.9}
  else if(frontWall<0.5){gas=-0.6;speedDesire=0.15;if(frontLeft>frontRight+0.1)steer=Math.min(steer,-0.5);else if(frontRight>frontLeft+0.1)steer=Math.max(steer,0.5)}
  else if(frontWall<0.7){gas=-0.2;speedDesire=0.35;if(midLeft>midRight+0.15)steer=Math.min(steer,-0.2);else if(midRight>midLeft+0.15)steer=Math.max(steer,0.2)}
  else if(frontWall<0.85){gas=0.2;speedDesire=0.5}
  else{gas=0.7;speedDesire=0.65}
  var frontObs=sensors.obstacle[0],leftObs=sensors.obstacle[1],rightObs=sensors.obstacle[2];
  if(frontObs<0.25){gas=Math.min(gas,-0.8);speedDesire=0.05;if(leftObs>rightObs)steer=Math.min(steer,-0.6);else steer=Math.max(steer,0.6)}
  else if(frontObs<0.45){gas=Math.min(gas,-0.3);speedDesire=Math.min(speedDesire,0.25);if(leftObs>rightObs+0.1)steer=Math.min(steer,-0.3);else if(rightObs>leftObs+0.1)steer=Math.max(steer,0.3)}
  else if(frontObs<0.65){gas=Math.min(gas,0.1);speedDesire=Math.min(speedDesire,0.4)}
  if(sensors.onRoad>0.5){laneFix=-sensors.laneOffset*3;laneFix=Math.max(-1,Math.min(1,laneFix))}
  else{gas=Math.min(gas,-0.3);speedDesire=0.1;laneFix=0}
  var nextAngle=sensors.nextWaypointAngle;
  if(Math.abs(nextAngle)>0.4&&sensors.distToWaypoint<0.3){speedDesire=Math.min(speedDesire,0.35);gas=Math.min(gas,0.1);steer=steer*0.6+nextAngle*0.4;steer=Math.max(-1,Math.min(1,steer))}
  var speedOut=speedDesire*2-1;
  return [steer,gas,speedOut,laneFix];
}

// Generate a single training scenario from the map
function generateScenario(map){
  var roadTiles=[];
  for(var y=0;y<MAP_H;y++)for(var x=0;x<MAP_W;x++)if(map[y][x]>=1&&map[y][x]<=3)roadTiles.push({x:x,y:y,type:map[y][x]});
  if(roadTiles.length===0)return null;
  var tile=roadTiles[Math.floor(Math.random()*roadTiles.length)];
  var cx=tile.x*TILE_SIZE+TILE_SIZE/2,cy=tile.y*TILE_SIZE+TILE_SIZE/2;
  var px=cx+(Math.random()-0.5)*TILE_SIZE*0.7;
  var py=cy+(Math.random()-0.5)*TILE_SIZE*0.7;
  var angle=Math.random()*Math.PI*2;
  var rayAngles=[0,-0.35,0.35,-0.7,0.7,-1.1,1.1,-1.5,1.5];
  var rayDistances=[100,85,85,70,70,55,55,45,45];
  var roadHits=[];
  for(var r=0;r<rayAngles.length;r++){
    var rayAngle=angle+rayAngles[r],maxD=rayDistances[r],hitDist=maxD;
    for(var step=6;step<=maxD;step+=6){
      var rx=px+Math.sin(rayAngle)*step,ry=py-Math.cos(rayAngle)*step;
      var rtx=Math.floor(rx/TILE_SIZE),rty=Math.floor(ry/TILE_SIZE);
      if(rtx<0||rtx>=MAP_W||rty<0||rty>=MAP_H||!(map[rty][rtx]>=1&&map[rty][rtx]<=4||map[rty][rtx]===6)){hitDist=step;break}
    }
    roadHits.push(hitDist/maxD);
  }
  var obstacleHits=[];
  for(var r=0;r<7;r++){
    var v=0.4+Math.random()*0.6;
    if(r===0&&Math.random()<0.25)v=Math.random()*0.35;
    if(r>0&&Math.random()<0.15)v=Math.random()*0.4;
    obstacleHits.push(v);
  }
  var wpAngle=(Math.random()-0.5)*2;
  var nextWpAngle=(Math.random()-0.5)*1.6;
  var speed=Math.random()*0.8+0.1;
  var onRoad=Math.random()>0.08?1.0:0.0;
  var roadTypes=[0,0.33,0.66,1.0];
  var roadType=roadTypes[Math.floor(Math.random()*roadTypes.length)];
  if(onRoad<0.5)roadType=0;
  var laneOffset=Math.random()*0.25;
  var distToWaypoint=Math.random();
  var sensors={road:roadHits,obstacle:obstacleHits,waypointAngle:wpAngle,nextWaypointAngle:nextWpAngle,speed:speed,laneOffset:laneOffset,onRoad:onRoad,roadType:roadType,distToWaypoint:distToWaypoint};
  var targets=computeTeacherFromSensors(sensors);
  var inputs=sensorsToInputs(sensors);
  return {inputs:inputs,targets:targets};
}

// TRAIN BRAIN OFFLINE — Real supervised learning with backpropagation
// Runs silently during game initialization
function trainBrainOffline(map){
  var nn=new NeuralNetwork([22,32,24,4]);
  var lr=0.008;
  var numSamples=4000;
  var epochs=15;
  var data=[];
  for(var s=0;s<numSamples;s++){
    var sample=generateScenario(map);
    if(sample)data.push(sample);
  }
  for(var epoch=0;epoch<epochs;epoch++){
    for(var i=data.length-1;i>0;i--){
      var j=Math.floor(Math.random()*(i+1));
      var tmp=data[i];data[i]=data[j];data[j]=tmp;
    }
    for(var i=0;i<data.length;i++){
      nn.train(data[i].inputs,data[i].targets,lr);
    }
    lr*=0.92;
  }
  return nn;
}
function GameEngine(canvas){

GameEngine.prototype.init=function(){
  var self=this;
  return this.sprites.generateAll().then(function(){
    self.map=generateMap();
    var tn=['grass','road_h','road_v','cross','sidewalk','building','park','water'];
    self.tileSprites=tn.map(function(n){return self.sprites.get('assets/tiles/'+n+'.png')});
    self.npcSprites=[1,2,3,4].map(function(i){return self.sprites.get('assets/image/npc_car'+i+'.png')});
    self.playerSprite=self.sprites.get('assets/image/player_car.png');
    self.wreckedSprite=self.sprites.get('assets/image/wrecked_car.png');
    self.roadTiles=[];
    for(var y=0;y<MAP_H;y++)for(var x=0;x<MAP_W;x++)if(self.map[y][x]>=1&&self.map[y][x]<=3)self.roadTiles.push({x:x,y:y});
    self.sidewalkTiles=[];
    for(var y=0;y<MAP_H;y++)for(var x=0;x<MAP_W;x++)if(self.map[y][x]===4)self.sidewalkTiles.push({x:x,y:y});
    self.minimapCanvas=document.createElement('canvas');self.minimapCanvas.width=MINIMAP_SIZE;self.minimapCanvas.height=MINIMAP_SIZE;
    self.minimapCtx=self.minimapCanvas.getContext('2d');self.renderMinimapBase();
    var startX=40,startY=40;
    for(var i=0;i<self.roadTiles.length;i++){var t=self.roadTiles[i];if(self.map[t.y][t.x]===3){startX=t.x;startY=t.y;break}}
    self.player=self.createPlayer(startX*TILE_SIZE+TILE_SIZE/2,startY*TILE_SIZE+TILE_SIZE/2);
    self.camera={x:self.player.x,y:self.player.y,lookAheadX:0,lookAheadY:0,zoom:1,targetZoom:1};
    self.npcs=[];self.botBrains=[];self.botFitness=[];
    // Train the neural network with real backpropagation on teacher data
    self.trainedBrain=trainBrainOffline(self.map);
    for(var i=0;i<NPC_COUNT;i++){
      self.npcs.push(self.spawnNPC(i));
      self.botBrains.push(self.trainedBrain.clone());
      self.botFitness.push(0);
    }
    self.pedestrians=[];for(var i=0;i<PED_COUNT;i++)self.pedestrians.push(self.spawnPedestrian());
    self.initMissions();
    if(self.onReady)self.onReady();
  });
};

// ============================================================
// MISSION SYSTEM
// ============================================================
GameEngine.prototype.initMissions=function(){
  this.missions=[];this.activeMission=null;this.missionNpc=null;
  // Place mission markers at road crosses spread across the map
  var crosses=[];
  for(var i=0;i<this.roadTiles.length;i++){var t=this.roadTiles[i];if(this.map[t.y][t.x]===3)crosses.push(t)}
  // Pick 5 spread-out crosses
  var picked=[];
  // Quadrant-based selection + center
  var regions=[[0.15,0.15],[0.85,0.15],[0.15,0.85],[0.85,0.85],[0.5,0.5]];
  for(var r=0;r<5;r++){
    var best=null,bestDist=Infinity;
    var tx=regions[r][0]*MAP_W,ty=regions[r][1]*MAP_H;
    for(var i=0;i<crosses.length;i++){
      var dx=crosses[i].x-tx,dy=crosses[i].y-ty,d=Math.sqrt(dx*dx+dy*dy);
      var tooClose=false;for(var j=0;j<picked.length;j++){var pdx=crosses[i].x-picked[j].tileX,pdy=crosses[i].y-picked[j].tileY;if(pdx*pdx+pdy*pdy<64){tooClose=true;break}}
      if(!tooClose&&d<bestDist){bestDist=d;best=crosses[i]}
    }
    if(!best)best=crosses[Math.floor(Math.random()*crosses.length)];
    var def=MISSION_DEFS[r];
    this.missions.push({
      id:def.id, name:def.name, desc:def.desc, color:def.color, reward:def.reward, type:def.type,
      tileX:best.x, tileY:best.y,
      markerX:best.x*TILE_SIZE+TILE_SIZE/2, markerY:best.y*TILE_SIZE+TILE_SIZE/2,
      state:'available' // available | active | complete
    });
    picked.push({tileX:best.x,tileY:best.y});
  }
};

GameEngine.prototype.startMission=function(mission){
  this.activeMission=mission;
  mission.state='active';
  this.missionIntroTimer=120; // ~2 seconds
  this.missionTimer=0;this.missionProgress=0;this.missionCurrentCP=0;this.missionCollected=0;this.missionPassengers=0;
  this.missionCheckpoints=[];this.missionWaypoints=[];this.missionNpc=null;
  var crosses=[];for(var i=0;i<this.roadTiles.length;i++){var t=this.roadTiles[i];if(this.map[t.y][t.x]===3)crosses.push(t)}
  var px=this.player.x/TILE_SIZE|0,py=this.player.y/TILE_SIZE|0;
  var self=this;

  switch(mission.type){
    case 'race':
      // Generate checkpoints forming a route from nearby to far
      // Exclude the mission start cross so first CP doesn't trigger instantly
      var startTX=px,startTY=py;
      var filtered=crosses.filter(function(c){return Math.abs(c.x-startTX)>2||Math.abs(c.y-startTY)>2});
      if(filtered.length<6)filtered=crosses.slice();
      var cps=[];var shuffled=filtered.slice().sort(function(){return Math.random()-0.5});
      for(var i=0;i<shuffled.length&&cps.length<6;i++){var c=shuffled[i];var ok=true;for(var k=0;k<cps.length;k++){var cdx=c.x-cps[k].x,cdy=c.y-cps[k].y;if(cdx*cdx+cdy*cdy<64){ok=false;break}}if(ok)cps.push(c)}
      while(cps.length<6)cps.push(filtered[Math.floor(Math.random()*filtered.length)]);
      // Sort by distance from player to create natural route (nearest first)
      cps.sort(function(a,b){var da=(a.x-px)*(a.x-px)+(a.y-py)*(a.y-py);var db=(b.x-px)*(b.x-px)+(b.y-py)*(b.y-py);return da-db});
      this.missionCheckpoints=cps.map(function(c){return{x:c.x*TILE_SIZE+TILE_SIZE/2,y:c.y*TILE_SIZE+TILE_SIZE/2}});
      this.missionCurrentCP=0;this.missionTimer=5400; // 90s
      break;
    case 'getaway':
      // Find a far cross as safe zone
      var best=null,bestD=0;
      for(var j=0;j<crosses.length;j++){var dx=crosses[j].x-px,dy=crosses[j].y-py,d=dx*dx+dy*dy;if(d>bestD){bestD=d;best=crosses[j]}}
      if(!best)best=crosses[Math.floor(Math.random()*crosses.length)];
      this.missionWaypoints=[{x:best.x*TILE_SIZE+TILE_SIZE/2,y:best.y*TILE_SIZE+TILE_SIZE/2,label:'УБЕЖИЩЕ'}];
      this.wantedLevel=3;this.missionTimer=2700; // 45s
      break;
    case 'delivery':
      // 3 pickup points + 1 delivery point
      var pts=[];
      for(var i=0;i<4;i++){
        var best=null,bestD=0;
        for(var j=0;j<crosses.length;j++){
          var dx=crosses[j].x-px,dy=crosses[j].y-py,d=dx*dx+dy*dy;
          if(d>200){var ok=true;for(var k=0;k<pts.length;k++){var cd=(crosses[j].x-pts[k].x)*(crosses[j].x-pts[k].x)+(crosses[j].y-pts[k].y)*(crosses[j].y-pts[k].y);if(cd<64){ok=false;break}}if(ok){bestD=d;best=crosses[j]}}
        }
        if(!best)best=crosses[Math.floor(Math.random()*crosses.length)];
        pts.push(best);px=best.x;py=best.y;
      }
      this.missionWaypoints=[];
      for(var i=0;i<3;i++)this.missionWaypoints.push({x:pts[i].x*TILE_SIZE+TILE_SIZE/2,y:pts[i].y*TILE_SIZE+TILE_SIZE/2,label:'ПОСЫЛКА '+(i+1),collected:false});
      this.missionWaypoints.push({x:pts[3].x*TILE_SIZE+TILE_SIZE/2,y:pts[3].y*TILE_SIZE+TILE_SIZE/2,label:'СКЛАД',collected:false});
      this.missionCollected=0;this.missionCurrentCP=0;this.missionTimer=5400; // 90s
      break;
    case 'hitman':
      // Spawn target NPC near a random cross
      var tCross=crosses[Math.floor(Math.random()*crosses.length)];
      this.missionNpc={x:tCross.x*TILE_SIZE+TILE_SIZE/2,y:tCross.y*TILE_SIZE+TILE_SIZE/2,angle:Math.random()*Math.PI*2,speed:2,maxSpeed:4,accel:0.08,health:200,dead:false,turnTimer:0};
      this.missionWaypoints=[{x:this.missionNpc.x,y:this.missionNpc.y,label:'ЦЕЛЬ'}];
      this.missionTimer=0; // no time limit
      break;
    case 'taxi':
      // 3 passenger pickup + dropoff pairs
      this.missionWaypoints=[];
      this.missionCurrentCP=0;this.missionPassengers=0;
      for(var i=0;i<3;i++){
        var pickCross=crosses[Math.floor(Math.random()*crosses.length)];
        var dropCross=crosses[Math.floor(Math.random()*crosses.length)];
        while(dropCross===pickCross)dropCross=crosses[Math.floor(Math.random()*crosses.length)];
        this.missionWaypoints.push({x:pickCross.x*TILE_SIZE+TILE_SIZE/2,y:pickCross.y*TILE_SIZE+TILE_SIZE/2,label:'ПАССАЖИР '+(i+1),type:'pickup'});
        this.missionWaypoints.push({x:dropCross.x*TILE_SIZE+TILE_SIZE/2,y:dropCross.y*TILE_SIZE+TILE_SIZE/2,label:'ПУНКТ '+(i+1),type:'dropoff'});
      }
      this.missionTimer=7200; // 120s
      break;
  }
};

GameEngine.prototype.completeMission=function(){
  var m=this.activeMission;
  if(!m)return;
  m.state='complete';
  this.money+=m.reward;
  this.score+=m.reward;
  this.lastCompletedReward=m.reward;
  this.missionCompleteTimer=150; // ~2.5s
  this.activeMission=null;this.missionNpc=null;
  this.missionCheckpoints=[];this.missionWaypoints=[];
};

GameEngine.prototype.failMission=function(){
  if(!this.activeMission)return;
  this.activeMission.state='available'; // can retry
  this.missionFailedTimer=120;
  this.activeMission=null;this.missionNpc=null;
  this.missionCheckpoints=[];this.missionWaypoints=[];
};

GameEngine.prototype.updateMissions=function(dt){
  var p=this.player;
  // Intro timer
  if(this.missionIntroTimer>0){this.missionIntroTimer-=dt;return} // Skip detection during intro
  // Complete timer
  if(this.missionCompleteTimer>0)this.missionCompleteTimer-=dt;
  if(this.missionFailedTimer>0)this.missionFailedTimer-=dt;
  if(this.checkpointFlash>0)this.checkpointFlash-=dt;

  if(!this.activeMission){
    // Check if player is near any available mission marker
    for(var i=0;i<this.missions.length;i++){
      var m=this.missions[i];
      if(m.state!=='available')continue;
      var dx=p.x-m.markerX,dy=p.y-m.markerY;
      if(dx*dx+dy*dy<5000){ // ~70px radius
        this.startMission(m);break;
      }
    }
    return;
  }

  var am=this.activeMission;
  // Timer
  if(this.missionTimer>0){
    this.missionTimer-=dt;
    if(this.missionTimer<=0){this.missionTimer=0;this.failMission();return}
  }

  var CP_RADIUS=16000; // ~126px radius - generous for driving
  switch(am.type){
    case 'race':
      if(this.missionCurrentCP<this.missionCheckpoints.length){
        var cp=this.missionCheckpoints[this.missionCurrentCP];
        var dx=p.x-cp.x,dy=p.y-cp.y;
        if(dx*dx+dy*dy<CP_RADIUS){
          this.missionCurrentCP++;
          this.checkpointFlash=30; // Flash effect
          this.spawnParticles(cp.x,cp.y,20,'#ffcc00',8,30); // More particles
          this.spawnParticles(p.x,p.y,8,'#ffffff',4,15);
          if(this.missionCurrentCP>=this.missionCheckpoints.length)this.completeMission();
        }
      }
      break;
    case 'getaway':
      if(this.missionWaypoints.length>0){
        var wp=this.missionWaypoints[0];
        var dx=p.x-wp.x,dy=p.y-wp.y;
        if(dx*dx+dy*dy<CP_RADIUS*2)this.completeMission();
      }
      // Keep wanted high and spawn police chase
      if(this.wantedLevel<2)this.wantedLevel=2;
      // Make nearby NPCs chase player as police
      if(Math.random()<0.02*dt){
        var chaseCount=0;
        for(var i=0;i<this.npcs.length&&chaseCount<3;i++){
          var npc=this.npcs[i];if(npc.dead)continue;
          var ndx=npc.x-p.x,ndy=npc.y-p.y;
          if(ndx*ndx+ndy*ndy<1600000){ // Within 400px
            npc.npc.targetX=p.x;npc.npc.targetY=p.y;
            npc.maxSpeed=Math.min(npc.maxSpeed+1,7);npc.color='#111111';
            npc.npc.waitTimer=0;chaseCount++;
          }
        }
      }
      break;
    case 'delivery':
      if(this.missionCurrentCP<this.missionWaypoints.length){
        var wp=this.missionWaypoints[this.missionCurrentCP];
        var dx=p.x-wp.x,dy=p.y-wp.y;
        if(dx*dx+dy*dy<CP_RADIUS){
          if(this.missionCurrentCP<3){
            this.missionCollected++;
            this.spawnParticles(wp.x,wp.y,8,'#44ccff',4,20);
          }else{
            this.spawnParticles(wp.x,wp.y,15,'#44ff44',6,30);
          }
          this.missionCurrentCP++;
          if(this.missionCurrentCP>=this.missionWaypoints.length)this.completeMission();
        }
      }
      break;
    case 'hitman':
      if(this.missionNpc&&!this.missionNpc.dead){
        var tn=this.missionNpc;
        // Drive target around
        tn.turnTimer-=dt;
        if(tn.turnTimer<=0){tn.angle+=(Math.random()-0.5)*1.5;tn.turnTimer=40+Math.random()*80}
        tn.speed=Math.min(tn.speed+tn.accel*dt,tn.maxSpeed);
        var nx=tn.x+Math.sin(tn.angle)*tn.speed*dt;
        var ny=tn.y-Math.cos(tn.angle)*tn.speed*dt;
        var ntx=nx/TILE_SIZE|0,nty=ny/TILE_SIZE|0;
        if(ntx>=0&&ntx<MAP_W&&nty>=0&&nty<MAP_H&&this.isDrivable(this.map[nty][ntx])){tn.x=nx;tn.y=ny}
        else{tn.speed*=-0.3;tn.angle+=Math.PI*0.5}
        tn.x=Math.max(CAR_W,Math.min(MAP_W*TILE_SIZE-CAR_W,tn.x));
        tn.y=Math.max(CAR_H,Math.min(MAP_H*TILE_SIZE-CAR_H,tn.y));
        // Update waypoint marker
        this.missionWaypoints[0].x=tn.x;this.missionWaypoints[0].y=tn.y;
        // Check collision with player
        var dx=p.x-tn.x,dy=p.y-tn.y;
        if(dx*dx+dy*dy<1225){
          var dist=Math.sqrt(dx*dx+dy*dy);
          var impF=Math.abs(p.speed)+tn.speed;
          tn.health-=10+impF*3;
          p.health-=1+impF*0.3;
          this.spawnParticles((p.x+tn.x)/2,(p.y+tn.y)/2,8,'#ff6633',6,20);
          if(tn.health<=0){
            tn.dead=true;
            this.spawnExplosion(tn.x,tn.y);
            this.completeMission();
          }
        }
      }
      break;
    case 'taxi':
      if(this.missionCurrentCP<this.missionWaypoints.length){
        var wp=this.missionWaypoints[this.missionCurrentCP];
        var dx=p.x-wp.x,dy=p.y-wp.y;
        if(dx*dx+dy*dy<CP_RADIUS){
          if(wp.type==='pickup'){
            this.missionPassengers++;
            this.spawnParticles(wp.x,wp.y,8,'#44ff44',4,20);
          }else{
            this.money+=500;this.score+=200;
            this.spawnParticles(wp.x,wp.y,10,'#ffcc44',5,25);
          }
          this.missionCurrentCP++;
          if(this.missionCurrentCP>=this.missionWaypoints.length)this.completeMission();
        }
      }
      break;
  }
};

GameEngine.prototype.renderMinimapBase=function(){

  for(var y=0;y<MAP_H;y+=2)for(var x=0;x<MAP_W;x+=2){var t=this.map[y][x];ctx.fillStyle=t>=1&&t<=3?'#555':t===4?'#777':t===5?'#333':t===6?'#2a5':t===7?'#248':'#252';ctx.fillRect(x*ms,y*ms,ms*2,ms*2)}
};

GameEngine.prototype.spawnNPC=function(index){
  var tile=this.roadTiles[Math.floor(Math.random()*this.roadTiles.length)];

  else if(roadType===2){angle=Math.random()>0.5?Math.PI/2:-Math.PI/2;} // vertical road
  else if(roadType===3){var dirs=[0,Math.PI/2,Math.PI,-Math.PI/2];angle=dirs[Math.floor(Math.random()*4)];} // cross
  else{angle=Math.random()*Math.PI*2;}
  // Calculate direction vector for lane offset
  var dirX=Math.sin(angle),dirY=-Math.cos(angle);
  var npcObj={x:nx*TILE_SIZE+TILE_SIZE/2,y:ny*TILE_SIZE+TILE_SIZE/2,angle:angle,speed:1.5+Math.random()*1.5,maxSpeed:3+Math.random()*3,accel:0.07,color:this.npcColors[index%4],isPlayer:false,driftAngle:angle,health:100,dead:false,deathTimer:0,medicQueued:false,towQueued:false,medicDone:false,beingTowed:false,towDone:false,policeChase:false,
    npc:{targetX:nx*TILE_SIZE+TILE_SIZE/2,targetY:ny*TILE_SIZE+TILE_SIZE/2,waitTimer:3+Math.random()*5,stuckTimer:0,
      // AI pathfinding: list of road tile waypoints
      path:null,
      pathIndex:0,
      pathTimer:0, // re-path interval
      prevTileX:-1,prevTileY:-1,
      // Direction the NPC entered the current road tile from
      lastDir:angle,
      // Avoidance: slow down near other NPCs
      avoidTimer:0,
      // Smart AI: intersection look-ahead, braking distance
      nextTurnAngle:0,
      distanceToTurn:999,
      // Personality: some drivers are faster/more aggressive
      personality:Math.random(), // 0=cautious, 1=aggressive
      signalTimer:0
    }
  };
  // Assign initial AI path
  this.assignAIPath(npcObj);
  return npcObj;
};

// ============================================================
// NPC AI PATHFINDING — BFS on road network with lane discipline
// ============================================================

// BFS pathfinding: find route from (sx,sy) to a random destination
GameEngine.prototype.computeAIPath=function(sx,sy,maxSteps){
  var map=this.map,roadTiles=this.roadTiles;
  var stx=sx/TILE_SIZE|0,sty=sy/TILE_SIZE|0;
  // If NPC is off-road, find nearest road tile as start
  if(stx<0||stx>=MAP_W||sty<0||sty>=MAP_H||map[sty][stx]<1||map[sty][stx]>3){
    var bestRT=null,bestRD=Infinity;
    for(var ri=0;ri<roadTiles.length;ri++){
      var rt=roadTiles[ri];
      var rdx=rt.x-stx,rdy=rt.y-sty,rd=rdx*rdx+rdy*rdy;
      if(rd<bestRD){bestRD=rd;bestRT=rt}
    }
    if(!bestRT)return null;
    stx=bestRT.x;sty=bestRT.y;
  }
  // Pick a random destination cross that's at least 10 tiles away
  var crosses=[];
  for(var i=0;i<roadTiles.length;i++){var t=roadTiles[i];if(map[t.y][t.x]===3){var dx=t.x-stx,dy=t.y-sty;if(dx*dx+dy*dy>100)crosses.push(t)}}
  if(crosses.length===0){crosses=[];for(var i=0;i<roadTiles.length;i++){var t=roadTiles[i];if(map[t.y][t.x]===3)crosses.push(t)}}
  if(crosses.length===0)return null;
  var dest=crosses[Math.floor(Math.random()*crosses.length)];
  // BFS
  var visited=new Uint8Array(MAP_W*MAP_H);
  var parentX=new Int16Array(MAP_W*MAP_H);
  var parentY=new Int16Array(MAP_W*MAP_H);
  var queue=[stx+sty*MAP_W];
  visited[stx+sty*MAP_W]=1;
  parentX[stx+sty*MAP_W]=-1;
  parentY[stx+sty*MAP_W]=-1;
  var dirs=[{dx:0,dy:-1},{dx:0,dy:1},{dx:-1,dy:0},{dx:1,dy:0}];
  var found=false,head=0;
  while(head<queue.length){
    var cur=queue[head++];
    var cx=cur%MAP_W,cy=(cur-cx)/MAP_W;
    if(cx===dest.x&&cy===dest.y){found=true;break}
    for(var d=0;d<4;d++){
      var nnx=cx+dirs[d].dx,nny=cy+dirs[d].dy;
      if(nnx>=0&&nnx<MAP_W&&nny>=0&&nny<MAP_H){
        var ni=nnx+nny*MAP_W;
        if(!visited[ni]&&map[nny][nnx]>=1&&map[nny][nnx]<=3){
          visited[ni]=1;
          parentX[ni]=cx;parentY[ni]=cy;
          queue.push(ni);
        }
      }
    }
    if(head>8000)break; // Safety limit — increased for 80x80 map
  }
  if(!found)return null;
  // Reconstruct path
  var path=[];
  var px=dest.x,py=dest.y;
  while(px!==-1&&py!==-1){
    path.unshift({x:px,y:py});
    var idx=px+py*MAP_W;
    var ppx=parentX[idx],ppy=parentY[idx];
    px=ppx;py=ppy;
  }
  // Limit path length
  if(path.length>maxSteps)path.length=maxSteps;
  return path;
};

// Assign a new AI path to an NPC
GameEngine.prototype.assignAIPath=function(npc){
  var path=this.computeAIPath(npc.x,npc.y,60);
  if(path&&path.length>1){
    npc.npc.path=path;
    npc.npc.pathIndex=1; // Skip current tile
    npc.npc.pathTimer=0;
    // Align NPC angle with first path direction for smooth start
    if(path.length>1){
      var fromTile=path[0],toTile=path[1];
      var desiredAngle=this.getTileDirection(fromTile.x,fromTile.y,toTile.x,toTile.y);
      // Only snap angle if difference is large (>90°) — otherwise smooth transition
      var angleDiff=desiredAngle-npc.angle;
      if(angleDiff>Math.PI)angleDiff-=Math.PI*2;else if(angleDiff<-Math.PI)angleDiff+=Math.PI*2;
      if(Math.abs(angleDiff)>Math.PI/2){
        npc.angle=desiredAngle;
        npc.driftAngle=desiredAngle;
      }
    }
  }else{
    // Fallback: pick a nearby random road tile
    var ctx=npc.x/TILE_SIZE|0,cty=npc.y/TILE_SIZE|0;
    var tgt=this.findNextRoadTarget(ctx,cty);
    if(tgt){npc.npc.path=[{x:ctx,y:cty},{x:tgt.x,y:tgt.y}];npc.npc.pathIndex=1;}
    else{npc.npc.path=null;}
    npc.npc.pathTimer=0;
  }
};

// Get the angle to face when moving from tile (fx,fy) to tile (tx,ty)
GameEngine.prototype.getTileDirection=function(fx,fy,tx,ty){
  var dx=tx-fx,dy=ty-fy;
  if(dx===1&&dy===0)return 0;         // East
  if(dx===-1&&dy===0)return Math.PI;   // West
  if(dx===0&&dy===1)return Math.PI/2;  // South
  if(dx===0&&dy===-1)return -Math.PI/2;// North
  return 0; // fallback
};

GameEngine.prototype.findNextRoadTarget=function(ctx,cty){
  var dirs=[{dx:0,dy:-1},{dx:0,dy:1},{dx:-1,dy:0},{dx:1,dy:0}];var rn=[];
  for(var i=0;i<dirs.length;i++){var nx=ctx+dirs[i].dx,ny=cty+dirs[i].dy;if(nx>=0&&nx<MAP_W&&ny>=0&&ny<MAP_H){var t=this.map[ny][nx];if(t>=1&&t<=3)rn.push({x:nx,y:ny})}}
  if(rn.length>0)return rn[Math.floor(Math.random()*rn.length)];
  for(var r=2;r<=15;r++){var c=[];for(var oy=-r;oy<=r;oy++)for(var ox=-r;ox<=r;ox++){if(Math.abs(ox)!==r&&Math.abs(oy)!==r)continue;var nx=ctx+ox,ny=cty+oy;if(nx>=0&&nx<MAP_W&&ny>=0&&ny<MAP_H&&this.map[ny][nx]>=1&&this.map[ny][nx]<=3)c.push({x:nx,y:ny})}if(c.length>0)return c[Math.floor(Math.random()*c.length)]}
  return null
};

GameEngine.prototype.createPlayer=function(x,y){return{x:x,y:y,angle:0,speed:0,maxSpeed:7,accel:0.14,color:'#cc2222',isPlayer:true,driftAngle:0,health:100,dead:false,deathTimer:0,lateralSpeed:0,drifting:false}};
GameEngine.prototype.start=function(){this.running=true;this.lastTime=performance.now();this.loop()};

GameEngine.prototype.restart=function(){
  this.playerDead=false;this.deathTime=0;this.shakeAmount=0;this.showingWasted=false;
  this.particles=[];this.skidMarks=[];this.wantedLevel=0;this.score=0;

  this.player=this.createPlayer(startX*TILE_SIZE+TILE_SIZE/2,startY*TILE_SIZE+TILE_SIZE/2);

GameEngine.prototype.setKey=function(key,pressed){if(pressed)this.keys.add(key);else this.keys.delete(key)};
